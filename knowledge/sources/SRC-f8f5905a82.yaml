abstract: "Targeted-text research summary, not original abstract: Compares continuous-time and sentence-level annotations on 2,884 overlapping MSP-Conversation/MSP-Podcast utterances. Tests aggregation functions, reaction-time shifts, annotator agreement, matched/mismatched annotation training and a small ComParE-based neural regressor. Limits: The two annotation protocols are not interchangeable. Label aggregation and annotator lag are studied, not agent-action hysteresis or calibration under deployment shift."
