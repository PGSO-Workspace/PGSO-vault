abstract: "Imported SDK execution, not PhDude re-execution. Clean SDK7805fb9: 48 process blocks, 1200 measured batches per arm, 23 scenarios and 96 calls per batch; all expected outcomes retained. Median block p50 latency: PGSO 0.515425 ms, minimal Python 0.604799 ms, Invariant 23.086647 ms, NeMo 425.849599 ms. Paired PGSO/minimal ratio 0.851699 (95% process-block bootstrap 0.846206–0.855259); minimal Python has lower warm RSS (12.311 vs 13.127 MiB). Single pinned-core Linux virtual host, configured public integration APIs, exploratory development workload. Diagnostic fixture: 13 receipts match predeclared labels, seven reason categories, no human diagnostic measurement. Raw evidence and excluded calibration history: DATASET-1910d5d442. No vendor-wide superiority, algorithmic novelty, developer productivity, human utility or submission readiness established."
