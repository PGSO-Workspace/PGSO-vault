abstract: |
  # PGSO: auditoría reproducible previa al estudio

  Fecha: 2026-09-14. Preparado por Codex para Lucio, como análisis asistido por IA.

  ## Alcance y estado

  Se clonó `PGSO-Workspace/pgso-sdk` y se verificó que `origin/main` apunta a
  `1b17c248d3608a7d80cc1147e8aa57acbb715132`, la misma revisión del snapshot del vault.
  No se encontraron otras ramas remotas, releases ni artefactos disponibles de GitHub Actions
  en las consultas realizadas. Esto no excluye datos guardados en otros equipos o servicios.
  No se modificó código de producción ni se publicó ningún cambio remoto.

  La suite original terminó correctamente con `cargo test --workspace --locked` antes de
  añadir las pruebas de esta auditoría. No se volvió a ejecutar el benchmark científico.
  Las nuevas comprobaciones evalúan contratos concretos: algunas revelan defectos de composición,
  otras requisitos del diseño propuesto que la API actual no satisface. No son nueve vulnerabilidades.

  ## Reproducción

  Entorno: Linux x86_64, rustc 1.93.1, LLVM 21.1.8.
  Archivo: `crates/pgso-actuator-mcp/tests/research_audit.rs`.

  ```sh
  cargo test -p pgso-actuator-mcp --test research_audit --locked
  cargo test --release -p pgso-actuator-mcp --test research_audit --locked
  ```

  Ambas ejecuciones: **11 comprobaciones; 2 controles pasan y 9 contratos fallan**.
  La salida 101 es esperada mientras se mantenga el código auditado sin correcciones.
  Los controles verifican recuperación con lectura nominal válida y preservación de herramientas protegidas.
  Los registros completos están en `research-audit-debug.txt` y `research-audit-release.txt`.

  SHA-256:

  | Archivo | Hash |
