abstract: "Targeted-text research summary, not original abstract: Text descriptions of environments condition a transformer SER model trained on MSP-Podcast with added Freesound/DEMAND noise. Tests unseen noise environments, multiple SNRs, MSP-IMPROV transfer, and deliberately incorrect environment tags. Limits: Assumes useful environmental information. Added-noise experiments do not cover every real recording distortion; cross-corpus benefit is attribute-dependent."
