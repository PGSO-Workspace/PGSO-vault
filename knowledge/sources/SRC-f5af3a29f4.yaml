abstract: "Targeted-text research summary, not original abstract: Audio/text transformers use contrastive and information-maximization auxiliary objectives, plus logit fusion. Target training data are unlabeled; 30% of target corpus is used for adaptation. Ten randomized repetitions evaluate transfer. Limits: Primarily laboratory corpora, with preliminary naturalistic results; target-data adaptation is required. Random utterance splits are described, so do not assume unseen-speaker evaluation."
