abstract: SDK source 19b5c58146af0e4c4f35e2cebe57d4cc81bceb6e adds optional live reward-basis scoring for DB, COMMUNICATE and ENV_ASSERTION. Observed effects are never reconstructed from attempted calls; only authored reference actions run in a separate gold environment. Empty, duplicate or unsupported reward bases and gold-action failures are rejected. Six focused checks, two default/composite CLI checks with four arms, and one actual seven-arm integration check with mocked generation pass. The CLI still selects the same three ENV_ASSERTION telecom tasks. DB/COMMUNICATE support has offline fixture evidence, not a completed domain-transfer evaluation; substring communication checks do not measure interaction quality.
