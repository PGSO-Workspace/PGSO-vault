abstract: "Targeted primary text review: Author-hosted 12-page ICSE 2026 PDF; first-page ACM reference names 2026 IEEE/ACM 48th ICSE, April 12–18, and DOI. External DSL rules combine event triggers, predicates and enforcement (stop, user inspection, predefined actions, LLM self-examination). LangChain hooks intervene before actions, after observations and at completion. Evaluations use RedCode, SafeAgentBench and FixDrive; manual and LLM-generated rules are distinct conditions. Limits: Author-defined rules and manual outcome judgments risk overfitting/bias. Enforcement latency excludes variable human/LLM delays. §6.3 states that future unsafe trajectories are not predicted."
