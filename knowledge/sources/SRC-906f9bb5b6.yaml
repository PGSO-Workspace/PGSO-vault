abstract: "Targeted primary text review: Publisher-layout article, Volume 12 (2024), pages 20654–20662; publication 2024-02-02, current version 2024-02-12; DOI verified on first page. CMU-MOSEI text sentiment model; MSP-Podcast arousal classified into low [1,3], mid (3,5], high (5,7]. Mel-spectrogram windows span five seconds with 50% overlap. A rule-based manager selects predefined sentence bodies and interjections from inferred sentiment/arousal. Limits: Real-user assessment and comparison against existing dialogue managers are explicitly future work (VI, p.20661). The demonstrator uses Android TTS; emotional synthesis is future work. No tool authorization, confidence abstention, hysteresis or trusted expiry is demonstrated in the inspected system."
