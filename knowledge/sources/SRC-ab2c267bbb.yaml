abstract: "Targeted-text research summary, not original abstract: Calibrates set-valued emotion predictions and evaluates coverage/set size on IEMOCAP and TESS, including cross-dataset tests and a proposed locally exchangeable mini-batch extension. Limits: Acted corpora do not establish live-agent safety. Marginal prediction-set coverage is distinct from selective classification, conditional reliability and authorized tool invocation. The v4 mini-batch proof has an algebraic concern detailed separately; journal version not compared."
