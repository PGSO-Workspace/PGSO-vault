abstract: "Research review summary, not the original abstract: MHE combines multimodal perception, dialogue generation and physical expression on Pepper. Targeted publisher-layout PDF reading covers pp.1621,1626-1628,1630-1631. Perception benchmarks, blinded response ratings and eye-tracking comparisons support different constructs. This is a direct affect-to-behavior precedent, not tool permission enforcement. The HRI sample description inconsistently mentions 16 and 6 participants on p.1630; do not reuse a quantitative HRI claim without resolving that discrepancy. TAFFC qualifies under the already verified UEFISCDI AIS/JCR2024 CS-AI Q1 classification; this is not a new ranking verification."
