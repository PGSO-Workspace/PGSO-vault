abstract: "Targeted primary text review: arXiv:2411.09349v1, submitted 2024-11-14; 17-page preprint; journal version not independently compared. Shared acoustic-model/projection/Transformer/classifier pipeline; 14 foundation models plus eGeMAPS and ComParE baselines; 10 datasets, 13 tasks. IEMOCAP uses sessions 1–4 for training and session 5 for testing. Section V-C evaluates transfer among IEMOCAP, MELD and MSP-Podcast after filtering incompatible labels. Limits: Cross-corpus evaluation covers three emotion corpora with label filtering; it is not an evaluation of downstream tool policies or confidence-aware interventions. Multilingual evaluation remains future work (VI)."
