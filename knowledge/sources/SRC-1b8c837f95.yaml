abstract: Opt-in task-level NeMo Guardrails and Invariant integrations use independent host-authored temporal state and real framework DSL decisions from raw acoustic observations. Shared Rust supplies schema, host-permission and actual sandbox callback enforcement with no paralinguistic governed tools in these arms. Three framework checks, three opt-in pilot checks and three default pilot checks passed offline. Paid generation was mocked; these checks establish connectivity and scoped behavior, not task superiority. Policy evaluation and callback are sequential; native framework temporal state and concurrent-host protection are not claimed.
