abstract: "The integration of Large Language Model (LLM)-based agents into enterprise systems promises transformative automation, yet it faces a critical bottleneck: the preservation of process context within complex, stateful environments such as SAP. Traditional Retrieval-Augmented Generation (RAG) systems, which rely predominantly on vector similarity, often fail to capture the relational dependencies, sequential constraints, and transactional semantics inherent in enterprise workflows. This paper introduces a Hybrid Vector-Graph RAG architecture specifically designed for agentic workflows in SAP landscapes. Our framework synergistically combines dense vector retrieval for semantic understanding with a property graph-based representation of process metadata, control flows, and data lineage. By maintaining a dynamic contextual state that evolves with each agentic action, the system ensures that retrieved information is not only semantically relevant but also procedurally valid and temporally coherent. We detail the construction of the hybrid knowledge base from SAP IDoc, BAPI, and table structures, and present a novel retrieval fusion mechanism that ranks information based on both semantic similarity and graph-distance to the current process node. Experimental evaluations on real-world SAP order-to-cash and procure-to-pay scenarios demonstrate that our approach significantly outperforms pure vector RAG baselines, reducing hallucination rates by 42% and improving task completion accuracy by 37% in multi-step agentic workflows. The findings underscore the necessity of structural process awareness for reliable enterprise automation and offer a scalable blueprint for embedding contextual intelligence into next-generation AI agents."
