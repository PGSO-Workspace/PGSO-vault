abstract: <p>Recent work in AI governance, runtime verification, and safety engineering has focused on interpretability, behavioral alignment, and supervisory monitoring of learning-enabled systems. These approaches constrain behavior or evaluate compliance, but they do not formalize admissibility of action under epistemic uncertainty at the execution boundary.&nbsp;<span>This paper introduces runtime execution authority as a deterministic gating function operating between action proposal and irreversible execution. As systems transition from advisory to agentic roles, governance must move from post-hoc interpretation to prospective authorization. We define execution authority as a model-agnostic function that evaluates structured evidence, policy state, uncertainty bounds, and risk classification prior to execution.</span></p> <p>Unlike alignment mechanisms that influence model outputs upstream, execution authority governs state transitions at runtime. Trust is therefore reframed from transparency of reasoning to permission under bounded uncertainty.&nbsp;<span>The contribution is conceptual. We formalize the separation between intelligence (which proposes actions) and authority (which permits them), situate this distinction within runtime verification and safety literature, and identify a structural gap in current governance approaches for execution-capable systems.</span></p>
