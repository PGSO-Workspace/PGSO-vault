abstract: "Agent systems increasingly combine model calls, tools, data movement, and inter-agent protocols, but their governance assumptions are commonly expressed outside the executable artifact. This paper presents ArgorixLang, a compiled language and runtime in which agent capabilities, policy, sovereign metadata, provider boundaries, and evidence requirements are explicit program constructs. We distinguish four claim classes throughout: implemented mechanisms, declarative metadata, proposed architecture, and properties not claimed. We study an authorized corpus of 33 runtime request directories using a reproducible, observational pipeline. Twenty-seven directories contain all five expected artifacts and six contain source only. All 27 complete evidence bundles pass offline digest and crossartifact verification of bytecode, trace, and security report, including a ledger digest recomputed from trace events and matched against the report's LedgerSummary; source integrity is outside bundle verification. At the same time, all 27 detailed policy reports set passed=false, require review, and record 44 unknown-rule violations each, despite a favorable top-level security_checks label. Thus bundle integrity does not imply policy approval, security, or certification. The corpus contains 7,155 ledger events and 1,188 detailed policy violations. The bounded injected.content field is present in 0 of 27-that is, none of the 27-complete, valid traces; six source-only directories have no trace and are not assessable, precluding prompt-level qualitative analysis. We describe the compiler, failclosed runtime, Agent Passport metadata, a declarative encoding of the unpublished ATrust conceptual protocol, its relationship to DCP-AI, and trace/report/bundle generation. The results demonstrate reproducible artifact production and offline integrity checking under the observed configuration; they do not demonstrate real identity authentication, credential verification, cryptographic handshakes, blockchain immutability, post-quantum security, compliance certification, or production isolation."
