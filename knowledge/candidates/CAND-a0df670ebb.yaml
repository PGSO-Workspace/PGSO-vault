abstract: "Se mettere in scena un dramma Shakespeariano chiede di dar corpo e voce a un turbine di sentimenti ed emozioni, mettere in scena un dialogo di Platone chiede di dar corpo e voce a un flusso di pensieri. In entrambi i casi la chiave è la parola, che in teatro può diventare carne, suono e azione. Portare Platone su un palcoscenico presuppone un lavoro specifico sul testo, poiché la lingua filosofica deve farsi anche lingua teatrale: in che modo? Partendo da una traduzione scrupolosa per approdare ad un fraseggio fluido, musicale, ritmico che stimoli e rafforzi la gestualità e la mimica dell’attore. Quasi 200 repliche di Simposio e Apologia di Socrate, ascoltate nell’arco di un decennio da un pubblico variegato che abbraccia, oltre ai classici appassionati di teatro, studenti di scuole superiori – e non solo licei, ma anche istituti tecnici – accademici, ordini di avvocati e magistrati nonché turisti stranieri in visita presso famosi siti archeologici – per i quali Apologia è stata appositamente allestita in lingua inglese – hanno dimostrato che la profondità del pensiero platonico può essere trasmessa e rimeditata in modo coinvolgente, piacevole e possibilmente emozionante."
