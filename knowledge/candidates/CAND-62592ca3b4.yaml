abstract: Africa is not facing an AI regulation gap; it is facing an AI enforcement gap. Nigeria, Kenya, South Africa, and the African Union have all moved quickly on data protection, financial conduct, and AI-specific rules, with real enforcement to back them, including a $220 million penalty against Meta and a ₦766.2 million penalty against MultiChoice Nigeria. At the same time, AI agents are already approving loans, screening transactions, and accessing patient records at production scale, built on frameworks (LangChain, LangGraph, CrewAI, AutoGen) with no built-in awareness of the jurisdiction they operate in. This paper argues that the resulting accountability gap is not a policy problem to be solved with more legislation, but an infrastructure problem, requiring a runtime enforcement layer that evaluates AI agent actions against jurisdiction-specific policy before execution. Drawing on firsthand experience translating Nigerian, Kenyan, and South African regulatory frameworks into machine-checkable policy, including a contribution merged into Microsoft's Agent Governance Toolkit that was outdated by a change in Nigerian law eight days later, the paper documents where legal requirements map cleanly onto code, where they don't, and what an operative runtime enforcement model looks like in practice. It closes with specific recommendations for developers, fintechs, and regulators, including the African Union's Continental AI Strategy Phase 2.
