abstract: Artificial intelligence (AI) technology has made remarkable progress in polymer materials, which has changed polymer science significantly. However, this community still relies heavily on the traditional research paradigm instead of the data-driven paradigm. This review advocates for a fundamental paradigm shift in polymer research from traditional experience-driven methods to data-driven approaches enabled by AI. While AI has made transformative advances in polymer design, property prediction, and process optimization, the field remains anchored in conventional methodologies. AI's computational advantages against persistent barriers are also evaluated, such as data scarcity, inadequate material descriptors, and algorithmic complexity. Potential solutions, including collaborative data platforms, domain-adapted descriptor frameworks, and active learning strategies, are also discussed. Furthermore, we demonstrate how high-quality data and explainable AI methodologies overcome computational limitations while ensuring result credibility in other areas, which can benefit polymer research. Ultimately, this work provides a roadmap for accelerating the sustainable convergence of data-driven AI innovation with polymer science.
