title: "A-MSTM: ATTEMPTED CATCH ESCAPE-OPTIMIZED MIXED ATTENTION-ENABLED BILSTM MODEL FOR BRAIN TUMOR CLASSIFICATION"
authors:
  - Divya Kumari
  - B. K. Anoop
year: 2025
venue: "Biomedical Engineering: Applications, Basis and Communications"
doi: 10.4015/s1016237224500571
url: https://doi.org/10.4015/s1016237224500571
abstract: A brain tumor is a disorder that originates from the abnormal development of brain cells. Due to their low incidence and diversity in appearance, tumors can have a tough time being diagnosed with a patient’s survival rate. The traditional approaches for brain tumor classification have certain limitations including adaptability, availability of data, interpretability, and the ability for generalization. The research proposed an Attempted Catch escape Optimizer-based mixed attentional Bidirectional Long Short Term Memory (A-MSTM), to improve the efficiency of brain tumor classification. The utilization of mixed attention mechanisms in the A-MSTM facilitates improved information processing, enabling the model to focus on relevant regions while preserving contextual information. The SCPA-Net architecture is optimized to upgrade the model’s ability to reconstruct images and learn meaningful representations, contributing to more accurate tumor segmentation. To extract discriminative features, the VGG-16 model is employed, which harnesses the ability of the model to capture hierarchical representations of input images. The integration of GLCM and statistical features enriches the overall model’s understanding of complex patterns associated with brain tumors. The A-MSTM model and the SCPA-Net’s adjustable parameters are optimized using the bio-inspired ACEO algorithm, which also improves the segmentation and classification results. The experimental evaluation of the proposed A-MSTM method involves a comprehensive analysis of BraTS 2017 and BraTS 2020 datasets, demonstrating superior performance compared to existing approaches in terms of accuracy, sensitivity, specificity, and balanced error rate of attaining 93.56%, 94.58%, 94.65%, and 5.45, respectively, for TP 90 analysis.
