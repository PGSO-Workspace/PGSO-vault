abstract: Ralph Waldo Emerson brilliantly said, “Life is a journey, not a destination.” As researchers, we travel on paths of knowledge throughout life. The outcomes of rigorous scientific investigation are contributions of new knowledge to the world. By integrating the conceptual and methodological advice of extant design science research (DSR) publications, this review provides a comprehensive framework for understanding the roles of knowledge in DSR journeys. We position DSR at the intersection of science and technology where the interplay of descriptive and prescriptive knowledge is most active. We delineate the various forms of prescriptive design knowledge and we examine the knowledge paths that utilize and produce the varied forms of knowledge in a DSR project. Six knowledge paths describe how knowledge is manipulated in different ways to grow new design knowledge (e.g., artifacts, design theories). We apply this framework to define, analyze, and expand the ideas of knowledge gaps and knowledge journeys. We further argue that more attention to design postulates (e.g., design principles, design features) in DSR along the outlined knowledge paths can contribute to an increase in actionable and sustainably useful and impactful digital innovations within the information systems (IS) discipline.
