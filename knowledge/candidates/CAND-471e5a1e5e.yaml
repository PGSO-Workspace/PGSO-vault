abstract: "Accurate national peak load forecasting is essential for reliable and cost-effective power system operation; however, comparisons across model classes are often distorted by inconsistent covariates, preprocessing, and validation protocols. This study presents a season-specific benchmark for South Korea’s daily national peak load, using fixed calendar and weather covariates, leakage-free train–test splits, algorithm-level reporting, and peak-aware evaluation. A total of 58 winter and 61 summer candidate configurations including traditional econometric methods, tabular machine learning models, sequence-aware deep learning models, structured regression, and simple mean ensembles were assessed. Results showed a strong seasonal dependence. In winter, the best-performing single algorithm was Time-Series Dense Encoder (TiDE), achieving a root mean squared error (RMSE) of 2,052 MW; this was an improvement of 39.3% over the strongest traditional baseline, Seasonal Autoregressive Integrated Moving Average with Exogenous Regressors and Fourier Terms (SARIMAX-Fourier), which recorded an RMSE of 3,379 MW. In summer, multivariate regression emerges as the suitable single model (RMSE: 2,402 MW), while a top-5 mean ensemble yields the best overall accuracy (RMSE: 2,037 MW). However, average accuracy did not ensure peak-day fidelity. In the summer test window, the lowest-RMSE algorithm missed the actual peak date by 28 days and yielded a 5.18% absolute percentage error (APE) on that day. In contrast, SARIMAX-Fourier correctly identified the peak date and achieved a substantially lower APE of 0.61%. These findings highlight that model selection should be both season-specific and objective-driven, balancing overall accuracy with peak-day magnitude and timing."
