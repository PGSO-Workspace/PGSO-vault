title: "The Claim-to-Action Gap: Measuring How Misinformation Turns False State into Tool Calls in Tool-Using LLM Agents"
authors:
  - Mohammadreza Rashidi
year: 2026
venue: null
doi: 10.21203/rs.3.rs-10646557/v1
