abstract: Artificial intelligence (AI) is becoming central to insurance operations, especially in property and casualty (P&C) claims processing. AI can speed up workflows and improve efficiency, but it also introduces risks. Large language models (LLMs) may generate false or misleading information, often called hallucinations. These errors can harm customers, cause financial losses, and weaken trust in insurance systems. Current safety tools, such as Llama Guard, focus on filtering harmful or toxic content. However, they do not ensure factual accuracy or address insurance-specific needs. This paper studies these gaps and proposes improvements to NVIDIA NeMo Guardrails to build stronger, domain-specific safeguards. The approach includes defining rules for factual correctness, validating policy details, and preventing unsupported responses. We evaluate these enhancements through experiments with insurance-related queries and measure improvements in accuracy and safety. Results show that customized guardrails significantly reduce misinformation and improve reliability. By integrating these measures, insurers can deploy AI systems that are safer, more accurate, and better aligned with regulatory and customer expectations.
