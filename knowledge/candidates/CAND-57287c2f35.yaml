url: https://doi.org/10.3390/educsci14080839
abstract: Affective intelligent tutoring systems (ATSs) are gaining recognition for their role in personalized learning through adaptive automated education based on students’ affective states. This scoping review evaluates recent advancements and the educational impact of ATSs, following PRISMA guidelines for article selection and analysis. A structured search of the Web of Science (WoS) and Scopus databases resulted in 30 studies covering 27 distinct ATSs. These studies assess the effectiveness of ATSs in meeting learners’ emotional and cognitive needs. This review examines the technical and pedagogical aspects of ATSs, focusing on how emotional recognition technologies are used to customize educational content and feedback, enhancing learning experiences. The primary characteristics of the selected studies are described, emphasizing key technical features and their implications for educational outcomes. The discussion highlights the importance of emotional intelligence in educational environments and the potential of ATSs to improve learning processes. This review identifies gaps in the current research and suggests future directions, including broader implementation across diverse educational settings and deeper integration of affective data to refine system responsiveness. Future research should investigate the integration of advanced natural dialogue modules and generative AI to create more sophisticated interfaces, underscoring the role of affective adaptation in educational technology.
