abstract: "This document presents a formally verified optimization within the QSOL-IMC Quantum Error Correction (QEC) framework (v68.4.1). The optimization exploits an algebraic invariant in belief propagation decoding: URW(min-sum, ρ = 1.0) ≡ baseline min-sum This equivalence is proven analytically, validated across all decoder schedules, and confirmed via bitwise identity checks under IEEE 754 double-precision arithmetic. Leveraging this invariant enables elimination of redundant computation in benchmark sweeps without altering outputs, convergence behavior, or test coverage. A secondary optimization removes repeated reconstruction of derived data structures through deterministic precomputation. The full test suite (3779 tests) remains unchanged and passes completely. The optimization yields a 43% reduction in preview sweep runtime and a ~7.6% overall runtime reduction. Scope. This document covers invariant validation and test-suite optimization only. No algorithmic changes to decoding behavior are introduced."
