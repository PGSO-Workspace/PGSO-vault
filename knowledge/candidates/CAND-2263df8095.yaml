abstract: Показано, що класичні засоби моніторингу програмних систем (журнали, метрики, розподілене трасування) спираються на припущення про детермінований потік керування, якого агентна система на основі великої мовної моделі не задовольняє. Виокремлено чотири припущення класичного моніторингу, що руйнуються в агентному середовищі. Запропоновано перелік десяти вимог до підсистеми спостережуваності, одиницею телеметрії якої є траєкторія рішення з фіксацією точок розгалуження, викликів інструментів і підстав вибору, та визначено, які з них не покриваються наявними засобами.
