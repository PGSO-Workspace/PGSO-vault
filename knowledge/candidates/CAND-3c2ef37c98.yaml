abstract: This essay focuses on the anger of Dhaniya, the female protagonist of Premchand's Godan. Rather than approaching it as a specifically feminist anger, it sees it more broadly as the anger of the oppressed, which signals hope that the conditions of oppression will change. Premchand is influenced by Karl Marx, and uses narrative emotion to tell the (Indian) story of labor and capital; this essay puts Panksepp's neurocognitive theory of anger in conversation with Marxist political theory, demonstrating how Marx's thoughts on systemic economic injustices can elucidate the “social context” in which emotion systems (such as RAGE, PLAY, and CARE) are activated.
