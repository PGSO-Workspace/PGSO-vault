abstract: The quick growth of Large Language Models (LLMs) signals a major change in artificial intelligence, especially in understanding and generating natural language. Even as these models become more popular, there is still not enough analysis connecting their design with practical uses in software engineering and cybersecurity. This paper aims to fill that gap by examining the basic functions of LLMs, including tokenization, self-attention, transformer architectures, and large-scale pretraining. We trace their development from earlier models like BERT and GPT-2 to modern multimodal and instruction-tuned models like GPT-4. Using a mixed-method approach, we look at benchmarking frameworks and evaluation metrics that focus on accuracy, reasoning, safety, and reliability. Our findings reveal important trends such as model specialization, memory improvement, and better alignment strategies, which together improve scalability and generalizability. We also explore how LLMs act as intelligent agents in software development tasks, including code generation, refactoring, debugging, and gathering requirements. They play crucial roles in cybersecurity, such as threat analysis and automated defense systems. In addition, we address current challenges like hallucination, data leaks, and vulnerabilities. We suggest future directions that focus on reliability, adaptation to different domains, and ethical use. This work provides a well-rounded and current view of LLMs, linking theory to practice in new AI-driven areas.
