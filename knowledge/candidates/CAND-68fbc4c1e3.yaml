abstract: Risk-aware navigation in unknown environments remains a fundamental challenge for autonomous vehicles in complex urban systems. To address this issue, this paper presents a differentiable optimization layered safety-critical control method based on conformal prediction. Specifically, conformal prediction is used to construct risk-aware obstacle ellipsoids under sensor noise. Then, two nested differentiable optimization layers are introduced to formulate control barrier functions for obstacle avoidance and persistent feasibility, respectively. Finally, a QPbased controller integrates these barrier constraints with input constraints. The effectiveness of the proposed framework is validated through numerical simulations.
