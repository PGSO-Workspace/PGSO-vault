abstract: Large Language Models (LLMs) show remarkable skill in complex reasoning tasks, aided by advanced techniques like Chain-of-Thought (CoT) prompting. However, existing research on adversarial attacks focuses mainly on syntactic and structural vulnerabilities, leaving a critical gap in understanding semantic attacks that target the reasoning process itself. This paper introduces Cognitive-Mimetic Adversarial Prompting (CMAP), a novel class of attacks that exploits documented human cognitive biases and logical fallacies to corrupt LLM reasoning chains. We present a taxonomy of CMAP attacks, propose new metrics to evaluate reasoning corruption, and introduce Fallacy-Bench, a benchmark for assessing LLM robustness against logical manipulation. Our work reveals fundamental vulnerabilities in current reasoning techniques and provides a foundation for developing more robust AI systems through logical inoculation.
