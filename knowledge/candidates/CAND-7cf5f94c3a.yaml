abstract: "Abstract The application of machine learning techniques in the field of tourism is experiencing a remarkable growth, as they allow to propose efficient solutions to problems present in this sector, by means of an intelligent analysis of data in their specific context. The increase of work in this field requires an exhaustive analysis through a quantitative approach of research activity, contributing to a deeper understanding of the progress of this field. Thus, different approaches in the field of tourism will be analyzed, such as planning, forecasting, recommendation, prevention, and security, among others. As a result of this analysis, among other findings, the greater impact of supervised learning in the field of tourism, and more specifically those techniques based on neural networks, has been confirmed. The results of this study would allow researchers not only to have the most up‐to‐date and accurate overview of the application of machine learning in tourism, but also to identify the most appropriate techniques to apply to their domain of interest, as well as other similar approaches with which to compare their own solutions. This article is categorized under: Application Areas > Society and Culture Technologies > Machine Learning Application Areas > Business and Industry"
