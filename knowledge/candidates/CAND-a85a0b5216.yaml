  - Xiaoqian Liu
year: 2024
venue: Managerial and Decision Economics
doi: 10.1002/mde.4323
url: https://doi.org/10.1002/mde.4323
abstract: "Abstract This study is grounded in the perspective of pressure perception, examining how a company's awareness of climate risk influences its propensity for violations. The study reveals that an enhanced perception of climate risks is correlated with an increased likelihood of such behaviors. This effect is primarily mediated through a mechanism of stress transmission, exacerbating the myopia and rent‐seeking activities of corporate managers. Furthermore, this study integrates a heterogeneity analysis within the framework of the fraud triangle theory to explore strategies for mitigating the impact of climate risk perception on corporate violations. The findings indicate that the influence of climate risk perception on corporate violations becomes insignificant under certain conditions: when companies offer strong equity incentives to managers, thus alleviating pressure; when companies are heavily influenced by Confucian culture, thereby reducing rationalizations; and when companies possess robust internal governance and are subject to stringent external oversight, thereby diminishing opportunities for violations. This study not only validates the pressure transmission mechanism of climate risk but also proposes avenues for mitigating the onset of non‐compliant behaviors induced by the perception of climate risk."
