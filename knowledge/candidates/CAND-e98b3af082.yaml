abstract: In Indonesia, the condition of education still tends to be unbalanced. The quality of education in urban areas is generally far better than the quality of education in rural areas. Education processes in rural areas face some problems like limited teaching resources, slight teaching tools, and monotonous teaching method. Therefore, an idea is emerged, a thinking to create a system in order to improve the quality of education in rural areas. Virtual Classbox 4.1 is a distance learning system developed to improve the quality of education in rural areas with video conferencing technology. Virtual Classbox 4.1 is designed based on Design Science in Information System Research. In order to produce a great system, a scientific guidance must be used. Remarkable system need astounding design, like a good house needs a strong foundation. Because of that, Design Science in Information System Research, which is very well known in information system design research world, is used.
