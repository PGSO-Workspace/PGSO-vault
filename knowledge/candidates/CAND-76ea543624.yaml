title: Expressed and Perceived Honesty Benefits Relationships Even When Couples Are Not Accurate
authors:
  - Bonnie M. Le
  - Princeton X. Chee
  - Claire J. Shimshock
  - Jenny D. V. Le
year: 2025
venue: Social Psychological and Personality Science
doi: 10.1177/19485506241312876
url: https://doi.org/10.1177/19485506241312876
abstract: Honesty is a highly valued virtue, yet it can be challenging to enact when it may compromise our most valued relationships. We tested preregistered hypotheses examining the distinct effects of expressed , perceived , and accurate perceptions of honesty on well-being and change. Romantic partners ( N couples = 214; N individuals = 428) discussed a desired change in the lab and reported on outcomes concurrently and three months later. Honesty was self-reported and rated by observers, with correspondence between these measures observed. Results of multilevel response surface analyses showed that greater expressed and perceived honesty—but not accurate perceptions of honesty—predicted greater well-being, relationship satisfaction, and target motivation to change concurrently, with some benefits emerging over time. The current results indicate that honesty can benefit relationships even when the truth may hurt, with more expressed and perceived honesty fostering better relationships regardless of whether couples share in that perception of honesty.
