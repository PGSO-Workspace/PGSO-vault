abstract: "Family businesses play a pivotal role in the global economy but are uniquely vulnerable to internal conflict due to the overlap of family and business roles. This systematic literature review (SLR) examines 25 peer-reviewed articles published between 2016 and 2025 to explore the evolving themes, theories, and methodologies in family business conflict research. The review responds to the urgent need for a deeper understanding of conflict dynamics amid rising challenges such as digitalization, intergenerational transitions, and global competitiveness. Using the PRISMA protocol and thematic analysis supported by the Watase Uake system, the study identifies four dominant categories in the literature: types of conflict (e.g., relational, generational, governance), sources of conflict, consequences of conflict on performance and relationships, and conflict resolution strategies. The findings reveal that Agency Theory and Socioemotional Wealth Theory are the most frequently applied, while cultural and digital factors increasingly influence conflict dynamics. Despite methodological diversity, research remains largely Western-centric and quantitatively focused, with limited attention to emotional and cultural dimensions in non-Western contexts. This SLR contributes by offering an integrative conceptual framework that synthesizes key variables, relationships, and contextual influences on family business conflict. It highlights the importance of culturally adaptive and proactive conflict management strategies, particularly in emerging markets. The study also identifies gaps for future research, including the need for longitudinal studies, mixed-method approaches, and exploration of digital tools in conflict resolution. The review informs both academic inquiry and practical governance in sustaining family firms."
