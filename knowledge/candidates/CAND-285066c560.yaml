abstract: Large language model (LLM)-powered conversational agents now mediate consequential decisions, yet individuals differ markedly in how far they trust and rely on them. We ask whether stable individual differences—particularly Big Five personality traits—moderate trust calibration and over-reliance in human–LLM interaction.We conducted a scoping review following PRISMA Extension for Scoping Reviews (PRISMA-ScR) guidance, charting 60 empirical studies (22 examining contemporary generative LLMs) identified through structured multi-source searches (Semantic Scholar, OpenAlex, and arXiv) and backward citation chasing. We synthesised the evidence using a structured synthesis-without-meta-analysis (SWiM) approach with vote-counting by direction of effect.Because much of the evidence base concerns adjacent technologies, we coded every study by AI-system type and separated findings that are LLM-specific from those extrapolated from broader human–automation research.Three patterns are robust. First, Neuroticism and trait anxiety are the most consistent individual-difference correlates of LLM over-reliance and dependency, operating through an affect-regulation and cognitive-offloading pathway. Second, Agreeableness is associated with more positive AI attitudes and greater susceptibility to AI-generated persuasion, especially under anthropomorphic design, though not straightforwardly with problematic dependence. Third, Openness predicts AI adoption, positive attitudes, and trust, but we found no direct evidence that it elevates over-reliance.Conscientiousness shows context-dependent and sometimes opposing effects, while Extraversion exhibits only modest effects on initial trust. Across studies, dispositional propensity-to-trust and system features—chiefly the form of explanation and uncertainty communication—are more proximal predictors of reliance than broad personality traits. Anthropomorphism shapes trust indirectly and conditionally rather than acting as a uniform amplifier.We organise these findings within a proposed Personality–Trust Calibration (PTC) framework and extend it to agentic LLMs, where the relevant failure mode shifts from over-reliance on advice to over-delegation of action. The framework is offered as a structured research agenda rather than a validated causal model.
