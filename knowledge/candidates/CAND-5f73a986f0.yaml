abstract: "Abstract Human oversight in AI-enabled workflows can become ethically nominal when an approval remains recorded but the authority supporting it has changed by the time an action is executed. This study develops Adaptive Runtime Governance (ARG) as a broader governance architecture and evaluates one implemented component: a deterministic execution gate that revalidates current human authorization and organizational governance evidence immediately before execution. The evaluated prototype, implemented in Python and FastAPI with SQLAlchemy persistence, checks decision state, persisted approvals, approver status and role continuity, approval freshness, policy-version continuity, and delegation conditions. Evidence consists of an anonymized retrospective snapshot containing 101 decisions and a controlled validation in an isolated SQLite database comprising 223 cases. All controlled cases matched their predefined outcomes: 30 positive execution cases returned HTTP 200, 192 negative or robustness cases returned the expected refusal status, and a final verification reported a valid linked chain across 492 audit events. The broader ARG architecture is presented as a proposed research framework rather than as an empirically validated system. The findings support a bounded conclusion: historical human approval and current execution authority are not equivalent, and selected conditions of attributable human authority can be made technically enforceable at the execution boundary. The study does not establish model safety, legal compliance, production security, organizational effectiveness, or adaptive behavior."
