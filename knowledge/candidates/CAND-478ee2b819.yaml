url: https://doi.org/10.61838/jhrlp.167
abstract: The Ni‘matullahi order is one of the Shiʿi Sufi traditions that emerged in the fourteenth century and became actively involved in significant social and political affairs during the Safavid era. Despite governmental restrictions and pressures imposed during the Safavid period, this order attracted segments of the population and some members of the court due to its mystical teachings and its emphasis on social service. This article examines the socio-political interaction between the Ni‘matullahi order and the Imami (Twelver Shiʿi) school during the Safavid era. By analyzing the religious and political climate of the period, the study investigates the position of the Ni‘matullahi order and the role of Sayyid Nur al-Din Shah Ni‘matullah Vali and his works in cultural and social developments (Tabataba'i, 2008). The research method is based on library research and data analysis aimed at assessing the extent of the influence of Ni‘matullahi writings on Imami thought. The findings indicate that the relationship between the Ni‘matullahi order and the Imami school was neither mere peaceful coexistence nor outright confrontation, but rather a form of reciprocal interaction that contributed to the formation of Shiʿi mysticism and the consolidation of the political order of the period. In addition, the role of the Safavid government in regulating and managing this interaction to strengthen Twelver Shiʿism and maintain political stability is highlighted. This article seeks to present a clear picture of the mutual influences of mysticism and politics in Safavid society.
