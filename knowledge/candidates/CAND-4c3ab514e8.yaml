abstract: "As robots integrate more into daily life, socially aware robots with specific social attributes and behaviors are necessary. This review aims to explore how social norms in Human–Robot Interaction (HRI) impact robot design and human perception. We searched for relevant articles in the following databases: ACM Digital Library, IEEE Digital Library, Scopus, Springer Link, and PsycINFO. After applying inclusion and exclusion criteria, a final set of 69 articles were included in the review. These articles were categorized based on whether they examined norm conformity or norm violations, and were further sorted into 12 categorical norm labels to assist in analysis and comparison. By examining the existing literature, this review uncovers how social norms impact aspects of HRIs like trust, acceptance, and comfort while highlighting the importance of aligning robot design with user expectations. It reveals design challenges such as accounting for cultural variations, context-specific norms, and evolving norms over time. Addressing these challenges has the potential to improve user experiences, promote broader acceptance of robots, and foster successful integration of robots into various domains. The findings contribute to the ongoing discussion on the role of social norms in HRI, offering valuable insights and a foundation for future research."
