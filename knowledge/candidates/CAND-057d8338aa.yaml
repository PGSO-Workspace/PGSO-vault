abstract: "Abstract: Levina Teerlinc's work as a limner, the Middle English word for those who illuminated books and documents, has failed to earn as much attention as her portrait miniatures, and this rich source of artistic and prosopographical context has not been thoroughly examined before this article. In particular, bringing Teerlinc's documentary decoration fully into consideration reveals a dense period of work for Mary I's administrations preceding the artist's more well-documented role as Elizabeth I's favored painter. Further, understanding the institutional processes behind the types of documents that Teerlinc painted adds to our knowledge of her professional networks. Together with at least one newly identified document, at least one important manuscript, additions to the Pembroke Hours, including the only complete, contemporary manuscript copy of Katherine Parr's Prayers or Meditations, has been missed and here is newly identified as Teerlinc's work. In the end, only by fully contextualizing Levina Teerlinc as a late medieval limner, as well as a Tudor portrait miniaturist, can we begin to truly understand her art."
