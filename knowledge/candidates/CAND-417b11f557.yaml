url: https://doi.org/10.1177/19485506261452705
abstract: Popular advice in media and self-help literature encourages people to trust their intuition when forming impressions of strangers. We tested this widespread lay belief by examining whether intuitive judgments are preferred over deliberate ones and whether such preferences are justified by differences in accuracy. In Study 1 ( n = 401), participants from the general population reported using intuition more frequently, preferring it, and expressing greater confidence in it compared to deliberate reasoning when judging strangers. In Study 2, we analyzed 21,739 judgments from 380 users of the quiz app “Who Knows,” who inferred personality-related characteristics from short video introductions. Judgment mode was experimentally manipulated within persons across multiple game rounds. While intuitive judgments were again preferred, accuracy did not differ between conditions. Thus, although intuition is favored when judging strangers, it does not yield higher accuracy but may still be adaptive by achieving comparable accuracy with less time.
