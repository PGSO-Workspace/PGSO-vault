abstract: "Abstract: Emotion regulation (ER) is connected to relevant outcomes for children and adolescents, such as well-being, educational achievement, and psychopathology. These findings resulted from numerous questionnaires aiming to conceptualize and assess ER in children and adolescents. The vast number of ER questionnaires for children and adolescents and their clinical implications warrant extensive discussion of their development or adaptation. However, limited attention is given to the role of regional differences and the inclusion of ER questionnaires from non-English-speaking countries. Consequently, European researchers and practitioners require effortful searches for regional ER questionnaires and largely rely on subjective judgments to choose which questionnaire they use for early detection of mental health problems in children and adolescents. Therefore, this review aims to comprehensively outline the available ER questionnaires for children and adolescents in Europe and their methodologically driven properties and qualities. We performed literature searches for ER questionnaires for children or adolescents developed or adapted in European countries in a semi-systematic search to include questionnaires in all European languages and literature regarding development or adaptation, specific assessed ER context, validation in clinical or at-risk population, and quality. Questionnaires on ER for children and adolescents represented one third of European countries, predominantly for adaptive and maladaptive ER in negative emotions. Only a fifth of questionnaires were examined in at-risk or clinical populations. The quality of relevant criteria ranged between somewhat satisfactory to unsatisfactory. Suggestions for adaptation studies, information access, and choosing ER questionnaires for children and adolescents are discussed."
