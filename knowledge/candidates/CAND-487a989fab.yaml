abstract: "Abstract This article introduces argumentation in recommender dialogue agents (ARDA), a novel theoretical and practical framework for designing advanced argumentative dialogue systems. Grounded in principles of pragmatics and argumentation theory, ARDA integrates linguistic theory and graph-based representations to model pragmatic dialogue acts such as clarification requests, explanations, and argumentation. The framework bridges the gap between theory and implementation by providing graph-based computational models that translate these formalised concepts into functional dialogue system components. The contributions of this article are twofold: (1) providing an overarching view of the theoretical approaches applied in our prior studies and (2) offering computational models that more effectively represent linguistic phenomena within dialogue systems. Furthermore, the article explores the application of ARDA in the context of movie recommendation systems, providing previously collected results that illustrate how these models enable natural, persuasive, and logically coherent interactions between humans and intelligent agents."
