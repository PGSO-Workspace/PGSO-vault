abstract: The current study explores the implementation of an embodied conversational agent called AiMA at home, for community-dwelling older adults and its impact on loneliness and emotional states of older adults. Seventeen community-dwelling older adults (12 women, 5 men) líving alone participated in the study. An embodied conversational agent was implemented in their homes for 15 days. The focus of the study is placed on both qualitative and quantitative aspects. In terms of the quantitative information, the amount of interaction (days, conversations, turns) was summarized, as well as the percentage of joy and sadness. Specifically, it was found that the most frequent transition from the initial to the final emotional state across interactions, for all participants, was from neutral to joy. In qualitative terms, participants answered an open-ended interview in which positive aspects reported of using the device and areas of improvement, were included. Results show that participants engaged and tended to engage with the ECA in an anthropomorphic way, in some cases showing a ‘human’ bond with the device. Despite both emotional and cognitive benefits were mentioned, the emotional positive impact of the interaction with the ECA (reduction of loneliness, elicitation of positive emotions) as the most frequently mentioned one. When mentioning areas of improvement, one of the aspects that participants missed was the lack of proactivity. Findings showed that participants engaged in interactions with the conversational agent, which suggests that it could a useful tool to mitigate loneliness and enhance positive emotions among older adults living alone.
