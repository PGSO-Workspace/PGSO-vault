doi: 10.1002/inmd.20240095
url: https://doi.org/10.1002/inmd.20240095
abstract: "Abstract The complex relationship between emotions and mental health demands a more comprehensive theoretical framework that can capture its dynamic and multifaceted nature. This perspective article proposes a novel trimodal approach that conceptually integrates three complementary methodologies: Ecological Momentary Assessment, physiological measurements, and Speech Emotion Recognition. By adopting a dynamical system perspective, we argue that the convergence of these methodologies could provide unprecedented insights into emotional dynamics in mental health research and practice. We discuss how this framework could transform our understanding by simultaneously capturing subjective experiences, physiological responses, and linguistic patterns in naturalistic settings. The proposed integration offers a conceptual foundation for developing more sophisticated approaches to mental health monitoring and intervention. We explore the theoretical implications, methodological considerations, and potential future directions of this integrated perspective, highlighting its promise for advancing both research and clinical practice in mental health."
