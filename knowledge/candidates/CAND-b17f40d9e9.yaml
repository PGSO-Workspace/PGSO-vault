abstract: Artificial intelligence (AI)-enabled conversational agents (AICAs) are transforming the tourism and hospitality sector. While studies focus on technical and operational aspects, there is limited exploration of consumer behaviour. This study employs the TCCM (Theory, Context, Characteristics and Methodology) framework to analyse the theoretical, contextual and methodological dimensions of AICA use. By utilising an AI-first, human-lens-second approach along with Leximancer for thematic analysis, it emphasises the importance of emotional, ethical and trust-related factors that are often overlooked in adoption models. The paper proposes an integrated conceptual framework that highlights the mechanisms, modifiers and implications of AICA use, along with offering future research directions.
