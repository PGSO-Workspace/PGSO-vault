abstract: "As voice agents become embedded in products as well as service interactions, firms increasingly seek personalization strategies that strengthen consumers’ acceptance and engagement. This research examines whether voice agents that sound more similar to users’ own voices elicit more favorable behavioral responses. Moreover, we investigate through which psychological mechanisms these effects occur. Across two experiments, we manipulate voice similarity using (1) pretested similar versus dissimilar AI voices and (2) individualized voice cloning that replicates users’ voices. Results consistently show that higher voice similarity increases purchase intention, use intention, and willingness to disclose personal information. Mediation analyses further demonstrate that voice similarity operates via two distinct, parallel mechanisms: self-congruency and trust. Our research advances research on voice agent-consumer relationships and demonstrates that increasing voice similarity is a robust personalization strategy that enhances consumer’s behavioral responses."
