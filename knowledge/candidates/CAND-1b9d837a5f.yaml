abstract: "I first introduce the idea of quasi-cumulative science: where we think we are building on foundations of prior work, only to find that the earlier work is not solid. There is no single cause for this, but rather an unfortunate combination of factors that, taken together, have a detrimental effect on science. I discuss five of these, together with possible solutions, namely: 1. Publication bias 2. Citation bias. 3. P-hacking 4. Low statistical power 5. Obsession of funders/journals with novelty."
