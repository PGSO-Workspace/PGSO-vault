title: "The unpleasantness of thinking: A meta-analytic review of the association between mental effort and negative affect."
authors:
  - Louise David
  - Eliana Vassena
  - Erik Bijleveld
year: 2024
venue: Psychological Bulletin
doi: 10.1037/bul0000443
url: https://doi.org/10.1037/bul0000443
abstract: "Influential theories in psychology, neuroscience, and economics assume that the exertion of mental effort should feel aversive. Yet, this assumption is usually untested, and it is challenged by casual observations and previous studies. Here, we meta-analyze (a) whether mental effort is generally experienced as aversive and (b) whether the association between mental effort and aversive feelings depends on population and task characteristics. We meta-analyzed a set of 170 studies (from 125 articles published in 2019-2020; 358 different tasks; 4,670 unique subjects). These studies were conducted in a variety of populations (e.g., health care employees, military employees, amateur athletes, college students; data were collected in 29 different countries) and used a variety of tasks (e.g., equipment testing tasks, virtual reality tasks, cognitive performance tasks). Despite this diversity, these studies had one crucial common feature: All used the NASA Task Load Index to examine participants' experiences of effort and negative affect. As expected, we found a strong positive association between mental effort and negative affect. Surprisingly, just one of our 15 moderators had a significant effect (effort felt somewhat less aversive in studies from Asia vs. Europe and North America). Overall, mental effort felt aversive in different types of tasks (e.g., tasks with and without feedback), in different types of populations (e.g., university-educated populations and non-university-educated populations), and on different continents. Supporting theories that conceptualize effort as a cost, we suggest that mental effort is inherently aversive. (PsycInfo Database Record (c) 2024 APA, all rights reserved)."
