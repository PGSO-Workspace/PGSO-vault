abstract: 'The article examines school bullying as a phenomenon situated at the intersection between empathy, morality, and the neural systems that support social interaction and emotion regulation. Drawing on recent psychological and neuroscientific literature, it synthesizes evidence that affective empathy and moral disengagement play complementary roles in facilitating or inhibiting bullying behavior in adolescence. The paper reviews data on the social brain, with a focus on the anterior cingulate cortex, amygdala and ventral striatum, highlighting how reduced sensitivity to others’ distress and increased sensitivity to social status and dominance can shape the profiles of aggressors. In parallel, it discusses how repeated victimization may leave enduring traces on neural circuits involved in stress regulation, self-representation, and social threat processing. The final section outlines clinical and educational implications, emphasizing early identification of risk factors, wholeschool interventions targeting group norms, and individual therapies that strengthen perspective taking, emotion regulation, and prosocial motivation. The article was developed within the research project "Moral patterns and bullying experiences in schools: a longitudinal approach based on an integrative educational intervention".'
