abstract: The emotional experience that accompanies us in experiencing life has caused numerous controversies due to the subjectivity of this experience, so that currently there is no scientific consensus on the place it occupies in psychic life, its nature, as well as the mechanism of production. Affective neuroscience has sought and provided an answer to these challenges by outlining a theory of personality from a bottom-up perspective, identifying seven primary emotional systems specific to the mammalian brain that originate in subcortical structures. The identification of these emotional systems was possible through the use of electrical stimulation techniques, pharmacological manipulation as well as studying the lesions caused at the animal brain level. The proposed vision in which emotion is seen from a categorical perspective, is a monistic one of the classic brain-mind duality, intending a new perspective in which the intrinsic aspect of the brain in certain mental contents is taken into account. This article provides an overview of this paradigm in which emotions originate in primary emotional systems determined by the process of evolution with a role for survival.
