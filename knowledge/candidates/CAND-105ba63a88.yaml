title: "From Tools to Agents: Meta-Analytic Insights into Human Acceptance of AI"
authors:
  - Bingqing Li
  - Edward Yuhang Lai
  - Xin (Shane) Wang
year: 2025
venue: Journal of Marketing
doi: 10.1177/00222429251355266
url: https://doi.org/10.1177/00222429251355266
abstract: As artificial intelligence (AI) becomes more autonomous and socially present, it is critical to understand how people accept AI not just as a technological tool, but also as an agent capable of (semi)autonomous decision-making and interaction. With a meta-analysis of 287 effect sizes representing over 119,000 individuals, this research examines the factors driving human acceptance of AI. Through a dual-perspective framework, AI as a tool versus AI as an agent, the authors identify key AI characteristics, including capability, role, expertise scope, and anthropomorphism, that significantly influence acceptance. These engineerable AI characteristics, along with contextual and individual factors, form an AI–task–user framework that explains AI acceptance across different use scenarios and user groups. These findings contribute to the discourse on AI acceptance and human–AI interactions, revealing a small, decreasing reluctance to accept AI and, more importantly, directing future research to empirical testing and theory building of AI acceptance from an agentic perspective. This research also provides an actionable user-centered design roadmap for practitioners to develop and communicate AI features that align with human expectations and enhance positive responses, especially at a time when agentic AI is rapidly becoming a technological and societal reality.
