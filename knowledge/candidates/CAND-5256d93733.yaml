abstract: "Modern systems increasingly convert external input into execution. Large language models generate actions, software supply chains deliver code, and automation frameworks translate both into system changes. Current defenses focus on detection, trust models, and post-execution containment. These approaches do not address the core failure mode: execution is granted implicitly. This paper presents a control-plane architecture that enforces admissibility before execution. Using IVD-ACP (Invariant Vector Defense, Admissibility Control Plane) as a reference implementation, it demonstrates how all inputs, including AI-generated actions and software dependencies, can be intercepted, evaluated, and assigned bounded authority prior to execution. A validation using a live agent environment is presented, along with direct application to recent supply chain security events including the Axios npm compromise."
