abstract: ABSTRACT Biomimetic robotics and intelligence, which draws inspiration from biological systems, is an emerging field that bridges biology, engineering, and artificial intelligence. By replicating biological structures, behaviors, and sensory systems, biomimetic robotics are designed to operate effectively in diverse environments, such as humanoid robots for domestic use, quadruped robots for uneven terrains, and aerial robots for navigation through confined spaces. Biomimetic intelligence, grounded in the study of natural cognitive processes, has led to the development of advanced algorithms like genetic algorithms and neural networks, which optimize problem‐solving and decision‐making in robotic systems. These innovations enhance the capabilities of biomimetic robots, enabling them to perform complex tasks autonomously and adapt to dynamic conditions. This survey provides an overview of the latest advancements in biomimetic robotics and intelligence, focusing on key areas such as biomimetic robots, sensors and sensing technologies, and intelligence algorithms. It also discusses the current challenges in the field and outlines potential directions for future research.
