abstract: "Autonomous artificial intelligence agents-software systems that perceive their environment, form decisions, and execute actions without continuous human direction-are being deployed into enterprise computing environments at an accelerating rate. These agents interact with databases, APIs, communication platforms, financial systems, and other agents, exercising operational authority that can have significant and irreversible consequences. Yet no standardized architectural layer exists to govern what agents are constitutionally permitted to do before they act. Existing approaches-model-level safety training, post-hoc observability, identity and authentication frameworks, and statistical consensus systems-address adjacent concerns but leave the core problem of runtime execution authority governance unsolved. This paper introduces the Execution Authority Control Layer (EACL), a constitutional governance architecture for AI agent systems. EACL introduces five novel components: () the Policy Constitution, a cryptographically signed governance instrument authored by a human principal that defines the execution authority of one or more AI agents; () the Execution Intent Envelope (EIE), a structured, cryptographically signed request format that agents must submit to an external governance plane before executing any action; () the Decision Engine, a deterministic rules evaluator that evaluates EIEs against applicable Policy Constitutions and returns permit, deny, or escalate decisions; () the Governance-of-Governance (GoG) Layer, a recursive protection mechanism that applies the same constitutional enforcement logic to attempts to modify the governance system itself; and () the Delegation and Attenuation Engine, which enforces the principle that delegated agents cannot receive more authority than their delegating parent agents. We present the formal model, security properties, implementation architecture, and a comparative analysis against existing approaches. We argue that EACL represents a necessary and previously absent layer in the AI system stack-analogous to the role of firewalls in network security-and that its constitutional model provides security properties that probabilistic and training-based approaches cannot achieve."
