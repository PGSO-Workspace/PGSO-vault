abstract: "<p>The revealing of AI systems challenges the notion that the exclusivity of an AI system’s data and model constitutes a source of competitive advantage. We explore two dimensions of revealing strategies: their completeness, describing which components are revealed, and their degree, determined by the license type. We draw on theoretical considerations and 24 interviews to construct hypotheses that we test on 659 AI systems. We find that larger and more novel models are revealed less completely and to a lesser degree, which is amplified for organizations that offer both revealed and non-revealed AI systems. We conclude that revealing AI systems serves to promote adoption and create lock-in across versions rather than to facilitate collaborative development, and introduce the notion of an “open freemium” business model.</p>"
