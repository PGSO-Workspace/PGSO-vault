title: A systematic literature review of recent advances on context-aware recommender systems
authors:
  - Pablo Mateos
  - Alejandro Bellogín
year: 2024
venue: Artificial Intelligence Review
doi: 10.1007/s10462-024-10939-4
url: https://doi.org/10.1007/s10462-024-10939-4
abstract: "Abstract Recommender systems are software mechanisms whose usage is to offer suggestions for different types of entities like products, services, or contacts that could be useful or interesting for a specific user. Other ways have been explored in the field to enhance the power of these systems by integrating the context as an additional attribute. This inclusion tries to extract the user preferences more accurately taking into account multiple components such as temporal, spatial, or social ones. Notwithstanding the magnitude of context-awareness in this area, the research community is in agreement with the lack of framework for context information and how to integrate it into recommender systems. Under this premise, this paper focuses on a comprehensive systematic literature review of the state-of-the-art recommendation techniques and their characteristics to benefit from contextual information. The following survey presents the following contributions as outcomes of our study: (i) determine a framework where multiple aspects are taken into account to have a clear definition of context representation, (ii) the techniques used to incorporate context, and (iii) the evaluation of these methods in terms of reproducibility and effectiveness. Our review also covers some crucial topics about context integration, classification of the contexts, application domains, and evaluation of the used datasets, metrics, and code implementations, where we observed clear shiftings in algorithmic and evaluation trends towards Neural Network approaches and ranking metrics, respectively. Just as importantly, future research opportunities and directions are exposed as final closure, standing out the exploitation of various data sources and the scalability and customization of existing solutions."
