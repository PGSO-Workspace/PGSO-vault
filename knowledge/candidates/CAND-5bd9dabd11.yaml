abstract: There are several metrics for calculating journal quartiles across different platforms in science. The official metric for determining journal quartiles in the Web of Science database is Impact Factor, and for Scopus it is CiteScore. The quartiles for the journals on the SCImago platform are formed based on the SJR metric (which is calculated with a different methodology than CiteScore). Moreover, the data used on SCImago and Scopus are slightly different. SCImago also assigns quartiles even to journals excluded from Scopus. For this reason,SCImago quartiles are not appropriate for substituting official Scopus quartiles. To obtain the correct Scopus values anyone should use this database, which even in the free Preview version provides such opportunity.
