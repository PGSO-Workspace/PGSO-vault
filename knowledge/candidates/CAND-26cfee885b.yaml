abstract: "Content analysis breaks down complex and unstructured texts into theory-informed numerical categories.Particularly, in social science, this process usually relies on multiple rounds of manual annotation, domain expert discussion, and rule-based refinement.In this paper, we introduce SCALE, 1 a novel multi-agent framework that effectively Simulates Content Analysis via Large language model agEnts.SCALE imitates key phases of content analysis, including text coding, 2 collaborative discussion, and dynamic codebook evolution, capturing the reflective depth and adaptive discussions of human researchers.Furthermore, by integrating diverse modes of human intervention, SCALE is augmented with expert input to further enhance its performance.Extensive evaluations on real-world datasets demonstrate that SCALE achieves human-approximated performance across various complex content analysis tasks, offering an innovative potential for future social science research.* Example: \"I love this company's new policy!It's so beneficial for everyone.\"* Example: \"Great job on the recent project!Keep up the good work.\"-Neutral: Neutral sentiment of users toward the issue/company.* Example: \"The company announced a new policy today.\"* Example: \"I heard about the recent changes, but I don't have an opinion yet.\""
