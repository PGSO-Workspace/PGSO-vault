abstract: Abstract This paper proposes a new federated neural network based on a hierarchical feature extraction using the convolutional neural network (CNN) and interpret the results with the explainable AI (XAI) tools to classify brain tumors effectively. The proposed model applies to different types of data, like MRI and fMRI images and EEG signals, to find features at different levels of the network—low, mid, and high. Special attention methods improve how well these features are represented, and then the features are combined using a final set of layers to make accurate predictions. Federated learning allows doctors at different hospitals to work together to train the model without sending patient data between them, which keeps everything private. XAI methods such as Grad-CAM, SHAP, and LIME help explain why the model makes its decisions. When tested on a well-known dataset of brain tumor MRI scans, this framework illustrates better accuracy results in classifying tumors while being clear and following privacy rules.
