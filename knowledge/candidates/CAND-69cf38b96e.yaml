abstract: Aiming to realize the demand of healthy, comfortable, biorhythms, personalized and adaptive lighting environments, human-centric lighting has become hot-spots issue. Fortunately, Large Language Model (LLM) technology have already presented its prominent advantages and great application prospect in many fields. This paper proposes a novel indoor lighting control framework with context-aware-based LLM and domain knowledge base. The multi-source information perception, fusion and decision-making mechanism is established, which collects occupant behaviour and environment parameter, and enable dynamic modelling of lighting environment and indoor lighting intelligent control. The domain knowledge base is constructed by integrating national standard files in the field of lighting, and also Building Information Model (BIM). The context-aware prompting strategy is developed to achieve indoor lighting dynamic control with domain knowledge base. An experiment was implemented in an office scenario, which employed to validate the feasibility and effectiveness of the proposed ideas. This research can provide new ideas to improve human-centric lighting system.
