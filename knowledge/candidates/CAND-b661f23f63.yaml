abstract: This study examines the concept, functions, and strategic significance of agents of influence as an instrument of promoting state national interests within the framework of contemporary influence operations. Based on a combination of historical-comparative analysis and review of existing scholarly approaches, the paper systematizes the definitional interpretations of “agent of influence” and identifies their role in the intelligence activities of leading states. The research demonstrates that agents of influence differ from traditional intelligence assets by operating predominantly within legal frameworks and targeting decision-making processes and public opinion rather than acquiring classified information. Particular attention is paid to professional categories most susceptible to recruitment, including political elites, media representatives, academics, and public figures. Empirical evidence from historical cases (World Wars, post-colonial Africa) and contemporary examples illustrates the dual nature of influence agents, whose activities may either stabilize or destabilize political systems depending on strategic objectives. The study highlights the extensive use of such agents by the Russian Federation as part of hybrid warfare against Ukraine, including pre-2014 infiltration into political, economic, and security institutions. The findings confirm that agents of influence constitute a critical element of modern influence operations, enabling adversaries to shape narratives, undermine institutional resilience, and facilitate strategic objectives without direct military engagement. The paper concludes that countering such threats requires not only intelligence measures but also institutional resilience, regulatory adaptation, and societal awareness.
