abstract: "Everyday speech perception is rarely restricted to a single domain but involves simultaneous processing of multiple cues available in the speech signal. For example, in addition to extracting the meaning of words from lexical cues, listeners also process indexical cues, such as the talker’s age and emotional state. Many studies of speech perception focus on a single domain of perception, such as word recognition or emotion recognition in isolation. Fewer studies investigate how listeners process multiple cues simultaneously. In this presentation, we will discuss how cognitive resource allocation or “listening effort” (measured using pupillometry) varies during speech perception depending on whether listeners focus on what is said (word recognition), how it is said (emotion recognition), or both simultaneously. In the present study, young adults with normal hearing listened to emotionally expressive or emotionally neutral sentences and completed three tasks in separate blocks: Identifying target words from the sentence, identifying the talker’s emotion, or identifying both. Using pupillometry, we measured pupil dilation in response to these tasks. This presentation will discuss the results within the context of emotional versus neutral and single-task (word recognition, emotion recognition) versus dual-task (both) speech processing. [Work supported by ASHFoundation New Investigator Research Grant.]"
