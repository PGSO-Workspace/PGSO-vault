abstract: "The integration of Large Language Models (LLMs) into software testing represents a paradigm shift in automated quality assurance. This paper presents TESTFORGE, a novel multimodal context-aware framework that leverages the code understanding capabilities of LLMs to generate comprehensive test cases with formal quality guarantees. Our methodology combines static code analysis, dynamic execution profiling, and LLM-powered semantic understanding through a mathematically grounded attention mechanism to produce contextually relevant test scenarios. We introduce novel algorithms for test completeness analysis and provide theoretical bounds on coverage guarantees. Our comprehensive evaluation on 847 opensource projects across five programming languages demonstrates statistically significant improvements: 47.3% increase in branch coverage (p ¡ 0.001, Cohen's d = 1.42), 52.1% improvement in mutation score (p ¡ 0.001, Cohen's d = 1.67), and 39.7% reduction in manual testing effort compared to stateof-the-art automated testing tools. The framework successfully identifies 73.2% more critical defects than baseline approaches, with generated tests exhibiting superior maintainability scores (average cyclomatic complexity of 2.3 vs. 4.7 for human-written tests). Our reproducible experimental artifacts and formal proofs are available for community validation."
