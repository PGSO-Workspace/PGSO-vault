abstract: The Model Context Protocol (MCP) standardizes communication between AI Models and external data sources or execution tools. While MCP deployments commonly rely on OAuth 2.1 for authorization, coarse-grained OAuth scopes and standard resource indicators are insufficient to express fine-grained contextual constraints-such as tenant boundaries, runtime characteristics, and deployment-specific authorization constraints-required to safely invoke MCP primitives. This paper introduces Contextual Claims as a second authorization dimension for conveying contextual constraints while preserving standard OAuth authorization flows. We define the syntax and semantics of contextual claims and present an end-to-end authorization architecture covering claim selection, construction, issuance, and authorization enforcement for MCP primitives. A security analysis argues that, under the stated trust assumptions, the proposed architecture mitigates context injection and primitive confusion attacks while maintaining compatibility with standard OAuth components. Finally, we discuss practical deployment trade-offs and report early implementation experience with the Mekarge A3 authorization platform, in which the core issuance and enforcement mechanism is implemented and the remaining extensions are specified as design extensions.
