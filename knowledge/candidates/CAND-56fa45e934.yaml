abstract: The integration of artificial intelligence (AI) in workplace settings significantly affects employees, particularly their wellbeing. Despite its growing relevance, the impact of AI on employee wellbeing remains underexplored. To address this gap, we conducted a survey and employed structural equation modeling to analyze data from Finnish and international companies headquartered in Finland (n = 207). We found that AI adoption does not directly impact employee wellbeing but indirectly influences it through work-related factors of task optimization and safety. This highlights the importance of strategically implementing AI to enhance aspects of work that are important to employees, thereby maximizing the wellbeing benefits of AI adoption. Practically, this study underscores the need for AI adoption to result in tangible improvements in organizational tasks and processes, data security, and occupational health. When these aspects are adequately addressed, AI adoption can enhance employee wellbeing and contribute to improved human-AI integration in the workplace.
