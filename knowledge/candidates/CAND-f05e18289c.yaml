venue: Philosophy & Technology
doi: 10.1007/s13347-025-00891-8
url: https://doi.org/10.1007/s13347-025-00891-8
abstract: Abstract The past few decades have brought rapid advancements in emotion recognition technologies (ERTs) that attempt to infer and monitor a user’s emotional state. One controversial class of ERTs attempts to infer emotional state by detecting coordinated changes in facial musculature (known as automated facial expression analysis or AFEA). Much discussion about appropriate usage and regulation of AFEA has occurred in isolation from scientific debate about what information facial expressions provide and whether emotional states can be inferred from them. In addition, scientific debate about the relationship between facial expressions and emotions does not engage with, and yet would likely benefit from, engagement with recent work in the philosophy of science on the relationship between models and target systems, and, in particular, cases where models introduce idealisations that approximate (but do not correspond to) real-world phenomena. This article brings both bodies of research to bear on the question of what AFEA can and cannot infer about a person’s feelings and intentions. It then advocates for more robust explainability for new and emerging ERTs and other ‘high-risk’ systems.
