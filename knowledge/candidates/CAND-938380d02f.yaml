abstract: EmoGPT is an innovative and emotion-aware chatbot that leverages emotion cause pair modeling to predict emotions and their underlying causes in user input. By incorporating the GPT-2 AI model, EmoGPT excels in generating personalized, open-ended, and human-like responses. Through this hybrid approach, the chatbot offers users a unique and engaging conversational experience, fostering more natural and dynamic interactions. EmoGPT's ability to comprehend emotions and contexts enables it to deliver responses that resonate with users, leading to enhanced user satisfaction and an enriched dialogue. In this paper, we present the architecture, design, and evaluation of EmoGPT, showcasing its effectiveness in providing open-ended and contextually relevant responses in various real-world conversational scenarios.
