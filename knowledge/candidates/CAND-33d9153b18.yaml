url: https://doi.org/10.21203/rs.3.rs-9875876/v1
abstract: "Abstract This quasi-experimental mixed-methods study investigated the effects of two AI-mediated conversational modalities on ESL learners' oral performance and speaking anxiety in a high-stakes English for Specific Purposes (ESP) context. Seventy-five adult ESL learners were assigned to one of three conditions: traditional instructor-led instruction (control), ChatGPT voice mode, or a Multimodal Embodied Conversational AI agent (MECAI) in Mixed Reality (MR). Over a six-week intervention, participants completed pre- and post-intervention mock job interviews assessed for fluency, vocabulary appropriateness, and grammatical accuracy. Speaking anxiety was measured using the Foreign Language Classroom Anxiety Scale (FLCAS) and physiological heart rate monitoring. Two-way repeated measures ANOVA revealed significant improvements in oral performance across all groups, with the MECAI group demonstrating the greatest gains (pre: 9.36; post: 18.52), followed by ChatGPT (pre: 8.96; post: 15.52) and the control group (pre: 7.92; post: 12.88). Pairwise comparisons confirmed statistically significant differences between all three conditions (p < 0.001). Although descriptive trends suggested a pattern of anxiety reduction in the MECAI group across both FLCAS and heart rate, neither anxiety measure reached statistical significance. Qualitative thematic analysis of structured interviews identified four themes: AI's role in shaping oral confidence, immersion and sense of presence in the MR environment, the indispensable role of the human instructor, and learner strategies for managing language anxiety. Findings suggest that embodied conversational AI in mixed reality offers meaningful advantages for ESP speaking development, while underscoring the continued centrality of human instruction in technology-enhanced language learning."
