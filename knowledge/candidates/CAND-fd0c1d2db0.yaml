abstract: "Clinical large language model (LLM) agents are entering production hospital deployments, where they read longitudinal electronic health records (EHRs), retrieve evidence from clinical knowledge bases, and assist with summarization, dosing, triage, and guideline-based decisions. The same architectural patterns that make these agents useful-instruction-following on retrieved text, tool use over patient data, and multi-turn conversation-also expose them to prompt injection attacks across heterogeneous input channels. This paper makes four contributions: (i) a structured survey of prompt injection in medical LLMs, including the MPIB benchmark, the JAMA Network Open simulation study, oncology vision-language attacks, and the broader prompt-injection literature; (ii) a threat model for EHR-accessing agents organized around five injection channels, four attacker objectives, and three cross-tenant risks, with explicit mapping to defense layers; (iii) EHR-Agent-PI, a benchmark specification extending MPIB and BIPIA along agentic, cross-channel, and outcome-aware dimensions, with specified scenarios, attack rules, disambiguated evaluation metrics (ASR, CHER, PER, TMR, FPR-H), per-cell instance counts, a reference judge prompt, a synthetic-data schema, a documented cost model, and a responsible-release plan compatible with HIPAA and GDPR constraints; and (iv) a layered six-layer defense architecture for clinical deployments, with explicit layerinteraction analysis. Empirical instantiation of EHR-Agent-PI is described as planned future work, with a small-scale pilot outlined in Section 8.5."
