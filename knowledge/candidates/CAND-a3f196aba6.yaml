title: "Speech Emotion Recognition Using Transfer Learning: Integration of Advanced Speaker Embeddings and Image Recognition Models"
authors:
  - Maroš Jakubec
  - Eva Lieskovská
  - Roman Jarina
  - Michal Spišiak
