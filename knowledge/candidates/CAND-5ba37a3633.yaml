title: "How and when paternalistic leadership influences service innovative behaviour while inhibiting counterproductive work behaviour among healthcare professionals: the roles of perceived supervisor support and public service motivation"
authors:
  - Muzammil Hussain
  - Trong Tuan Luu
  - Timothy Marjoribanks
year: 2025
venue: Journal of Health Organization and Management
doi: 10.1108/jhom-08-2024-0333
url: https://doi.org/10.1108/jhom-08-2024-0333
abstract: "PURPOSE: Healthcare is a service industry where fulfilling the needs of patients (customers) is challenging. Various factors, including cost, system complexity, staffing behaviours and technological advances, play vital roles. Drawing upon social exchange theory, this study seeks to determine how paternalistic leadership (authoritarianism, benevolence and morality) influences employee service innovative behaviour and counterproductive work behaviour via perceived supervisor support in the healthcare sector. Additionally, the study investigates the role of the public service motivation of individuals as a moderating factor in this relationship. DESIGN/METHODOLOGY/APPROACH: A pilot study and a main study were conducted to test the hypotheses. We collected data from healthcare professionals in Pakistan's large public, private and semi-government hospitals. We applied bootstrapping with 5,000 replications and structural equation modelling to analyse the data. FINDINGS: Results indicate that authoritarianism was negatively associated with service innovative behaviour, whereas benevolent and moral behaviours were positively associated with service innovative behaviour via perceived supervisor support (mediation). Our findings shed light on the moderating role of public service motivation. ORIGINALITY/VALUE: This empirical quantitative study has several theoretical and practical implications. Findings of our study provide evidence that a paternalistic leadership style can influence both positive (service innovative behaviour) and negative (counterproductive working behaviour) working behaviours simultaneously via perceived supervisor support at an individual level in the service (healthcare) industry. This study also highlights the moderating role of public service motivation as an individual motivation factor."
