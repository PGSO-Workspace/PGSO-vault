abstract: <p>This paper reconstructs the FERZ doctrine as a unified analytical argument. Beginning with the distinction between observation and pre-execution authorization, it states the additional definitions and integrity requirements from which the runtime authorization boundary, authorization artifact, Authorization Boundary Integrity Model, and Five Tests Standard follow. The argument is conceptual and classificatory. It does not report empirical validation or claim that these constructs follow from a single premise alone. The derivation proceeds from the governance problem through the separation of authority, delegation, policy, authorization, and enforcement; positions the resulting structure relative to the reference-monitor, access-control, and runtimeverification traditions, to proof-carrying authorization and related evidence models, and to the provenance tradition; and culminates in the Authorization Non-Substitution Principle [1], for which the corpus's substitution analyses provide representative applications. An appended source map identifies the controlling publication for each doctrinal position, and a claim-status appendix states, for each principal construct, what kind of claim it is, how it can be independently examined, and what it does not establish.&nbsp;</p>
