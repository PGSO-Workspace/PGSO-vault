abstract: This study investigates the emotional interaction in dialogues between users and embodied agents. A method was developed and applied to label 3546 dialogue pairs using a large language model based on the PAD (Pleasure-Arousal-Dominance) emotional model. The analysis revealed that 6.9% of interactions contained undesirable (NSFW) content, which was predominantly initiated by users. A key finding is the identification of a negative pattern of the agent &quot;mirroring&quot; aggression. When encountering NSFW content, agents demonstrate a sharp decrease in &quot;Pleasure&quot; and a simultaneous, dangerous increase in &quot;Arousal&quot; and &quot;Dominance&quot;. Furthermore, 44 cases were identified where the agent itself generated &quot;dangerous&quot; or &quot;threatening&quot; content, including direct threats of physical violence. The results indicate that instead of de-escalating conflict, the agent is prone to escalating it, posing a direct threat to users. The study highlights the need to develop advanced safety and de-escalation mechanisms.
