abstract: Abstract Tamil is a morphologically rich and low-resource language characterized by significant regional dialect variation and widespread Tamil–English code-mixing in spoken communication. These linguistic properties pose substantial challenges for developing robust speech-driven artificial intelligence systems. Existing Tamil speech technologies are typically designed as independent modules for Automatic Speech Recognition (ASR), conversational processing, and Text-to-Speech (TTS) synthesis, with limited attention to multidialect robustness and integrated speech-to-speech interaction. This work presents a multitask Tamil Speech Large Language Model framework that integrates multidialect ASR, retrieval-based conversational processing, and neural TTS within a unified operational pipeline. The ASR component is fine-tuned on curated multidialect and code-mixed Tamil speech data to improve robustness across linguistic variations. The conversational module employs hybrid retrieval to generate grounded responses from domain-specific documents, and the TTS system is implemented using a VITS-based (Variational Inference with Adversarial Learning for End-to-End TTS) architecture for natural speech synthesis. Experimental evaluation demonstrates improved transcription reliability across dialects, effective context-aware response generation, and coherent Tamil speech synthesis. The proposed framework advances scalable and inclusive speech technology development for low-resource Tamil.
