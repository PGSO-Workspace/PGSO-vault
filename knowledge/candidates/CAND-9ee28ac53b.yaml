abstract: "Agentic chemistry workflows coordinate simulation tools, intermediate records, and automated decisions across agents or agent-like stages. They can fail before any numerical result is produced: a downstream agent or workflow step may act on exchanged information that is incomplete or unsupported by the recorded trace. A representative case is reaction-level thermochemistry aggregation when one or more species lack valid thermochemistry records. We present a typed trace-state validation layer for agentic computational chemistry workflows. The layer represents information-flow validity requirements as validation rules over workflow stages, chemical trace symbols, declared resources, and failure labels. These rules express precedence, trace-state guards, resource serialization, and bounded retry. Admitted rules are accumulated by monotonic merge and compiled into an Answer Set Programming backend that derives admissible transitions, validation-failure explanations, recovery actions, and workflow-state diagnostics. For evaluation, we use ChemGraph as an existing agentic chemistry substrate and exercise information-flow failures in thermochemistry workflows. The primary test is guarded reaction-level aggregation: when species-level thermochemistry records are missing, the layer rejects the downstream aggregation request before an aggregate quantity is produced. Supporting experiments show retry-exhaustion diagnostics under persistent stage failure, mutual exclusion over a declared logical resource, and validation-rule acquisition from naturallanguage instructions with reliable rejection of unsupported instructions but weaker serialization acquisition. Scientific Contribution: This work introduces trace-state validation as a cheminformatics infrastructure layer for agentic computational chemistry workflows. It differs from tool-schema validation and generic agent-level constraint enforcement by checking whether exchanged workflow information supports chemically meaningful downstream transitions. The approach does not alter simulation methods 1 Agentic Chemistry Workflow optimize → vibrations → thermochemistry runtime trace completion and failure symbols guarded boundary reaction-level aggregation query emits queries"
