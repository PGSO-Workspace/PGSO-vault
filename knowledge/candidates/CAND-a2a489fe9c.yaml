abstract: Whether it's improved human-control interaction or more empathetic contact over the internet, voice-based emotional recognition and emotion acknowledgment have great potential. The goal of this model is to identify the emotional state of an individual by analyzing their voice and tone. By employing state-of-the-art machine learning methods such as deep neural networks, we apply the methods to build a model that accurately predicts a vast range of emotions contained in audio recordings. These programs, though different, all use multiple strategies to address the many systemic and cultural factors affecting educational equity. The initial results show the model is able to achieve high accuracy of detecting emotions from different demographics. Integrating this model in the voice-based survey systems, this overview of respondent’s emotional response can help in enhancing overall survey analysis and enacting more powerful communication experiences. The highest accuracies using Multilayer Perception classifier were achieved by the proposed system with 96%. The relatively low perception score of 0.51, however, signals room for improvement in how well the model grasps subtle variations in emotional states. The above results showcase the significant strides made towards recognizing the emotional state of individuals based on their voice, with the system proposed yielding promising accuracy, paving the way for more effective and empathetic communication in digital touchpoints. Their study enhances the accuracy of AI-based emotion detection models with practical applications in real life, including in user-specified fields like market research and personalized user experiences.
