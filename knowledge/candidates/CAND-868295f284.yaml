abstract: Maximum power point tracking (MPPT) is essential for maximising energy extraction from photovoltaic (PV) systems. Classical algorithms such as Perturb & Observe (P&O) and Fuzzy Logic Control (FLC-P&O) perform effectively under uniform and transient irradiance conditions, respectively, but fail under partial shading due to local maximum power point trapping. Metaheuristic approaches such as the Grey Wolf Optimizer hybrid (GWO-P&O) can escape local optima under partial shading but exhibit increased convergence time and unnecessary search overhead under uniform conditions. Since no single MPPT algorithm performs optimally under all operating conditions, this paper proposes an LLM-based adaptive MPPT selector that dynamically dispatches the most suitable algorithm according to real-time PV operating conditions. Using structured irradiance descriptors and contextual system information, the LLM performs zero-shot classification of the operating scenario and selects the corresponding MPPT strategy. In contrast to fixed threshold-based switching approaches, the proposed selector offers flexible and extensible supervisory decision-making without requiring redesign when new algorithms or operating conditions are introduced. Simulation results obtained on a 400 W, 4S×2P PV array connected to a boost converter under different irradiance scenarios demonstrate that the proposed selector achieves an average tracking efficiency of 98.7%, outperforming fixed P&O (86.8%), fixed FLC-P&O (91.1%), and fixed GWO-P&O (90.5%) deployments.
