abstract: "We propose a runtime actuarial layer for autonomous AI agents in which every side-effect-bearing action carries a time-consistent, counterfactual risk toll computed against a contractually fixed safe default, inside an explicit underwriting boundary. The framework treats per-action insurance as the primary unit of analysis and replaces post-hoc annual liability cover with a pre-action transaction layer. The draft establishes four foundational results: (i) a well-defined counterfactual toll under a chosen safe-default mapping and continuation policy, with explicit non-uniqueness; (ii) a no-splitting property within an underwriting boundary that telescopes path-decomposed actions into a boundary potential, with a corollary tying gaming-resistance to boundary design; (iii) an irreversible-authority premium, split into a strictly positive action-level component and an if-and-only-if characterisation of the set-level robust capital increase; and (iv) a finite-sample conservative gating bound and a budget-recursion guarantee on the executed-action positive toll, with explicit caveats for online adaptive action selection. Each theorem is accompanied by a proof sketch isolating the assumptions used. A reference implementation in Python verifies the runtime engine end-to-end on a coding-agent database environment, with regression tests for two non-obvious failure modes: a loss-attribution error in which backup operations can mask the apparent loss from dropping a production table, and a gate-bypass error in which a priced action with a negative point estimate could skip the conservative envelope. Both failures are diagnosed in code and prevented by design."
