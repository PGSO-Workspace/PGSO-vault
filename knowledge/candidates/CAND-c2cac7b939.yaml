abstract: Empathetic dialogue systems must synergize complex information from conversation history, user personas, and commonsense knowledge to generate emotionally resonant responses. However, existing Transformer-based frameworks suffer from quadratic computational complexity and often struggle with noisy knowledge fusion. In this paper, we propose Multi-Input Mamba (MIM), a high-efficiency framework for multi-factor empathetic dialogue generation. We replace the standard Transformer backbone with a selective state-space model to achieve linear-time complexity. Specifically, we design a Gated Cross-Attention Fusion mechanism within the Mamba blocks to adaptively integrate persona and commonsense representations while suppressing irrelevant noise. Furthermore, we leverage Large Language Models to perform dynamic social reasoning, providing high-fidelity commonsense premises that surpass traditional static knowledge graphs. Experimental results on the PEC dataset demonstrate that MIM consistently outperforms baselines, including EFCP, across both automatic metrics and human evaluations. Notably, our approach achieves superior performance with significantly lower GPU memory overhead and inference latency, offering a scalable solution for building socially intelligent conversational agents.
