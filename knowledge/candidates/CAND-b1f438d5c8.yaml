abstract: ABSTRACT Recent advances in artificial intelligence (AI) applications and the growing managerial emphasis on AI‐mediated touchpoints have accelerated scholarly interest in brand communication (BC). Addressing the field's fragmentation, this study synthesizes findings from 84 peer‐reviewed articles through a systematic literature review, integrating bibliometric mapping with the TCCM (Theory, Context, Characteristics, and Methodology) framework. The analysis identifies key themes including message design and interface cues, early communicator impressions, and downstream attitudinal and behavioral outcomes, while revealing unresolved issues and boundary conditions across sectors, cultures, and platforms. Several critical research gaps are identified, indicating the need for comparative assessments of technology‐centric and socio‐psychological theories, investigations in underrepresented regions and trust‐sensitive industries, and deeper examination of platform‐appeal fit, authenticity in generative content, transparency, user control, and contact cadence. Methodological recommendations include sequential mixed‐method designs linking qualitative insights with causal experiments and behavioral validation. Additional approaches such as netnography, eye‐tracking, and facial‐expression analysis are emphasized for capturing nuanced affective responses. These findings provide a comprehensive foundation for future inquiry and practical guidance for designing AI‐enabled BC that is effective, trustworthy, and contextually appropriate.
