abstract: Affective empathy is the response and feeling to others’ emotions, it includes empathic concern and personal distress. In the real situation, empathy always occurs under certain specific circumstances and can develop into an individual’s prosocial behavior. In this experiment, the relationship between the empathy state and prosocial behavior of college students was discussed using specific emotional materials. Batson’s Empathy Adjective Scale and the revised Prosocial Behavior Scale were used. The results show that viewing specific emotional materials can stimulate different levels of emotional empathy. In a state of high emotional empathy, people have higher levels of prosocial behavior. Different emotional empathy states can only have a significant impact on some dimensions of prosocial behavior, including three dimensions of openness, compliance, and emotion. However, the three dimensions of anonymity, altruism, and urgency do not have a significant impact.
