abstract: Truck drivers play a pivotal role in global freight transport systems, yet their occupational and behavioral risk exposures make them a priority population in road safety research. This systematic review examines the factors influencing risky driving behaviors among truck drivers and their impacts on road safety outcomes. Following the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) 2020 guidelines, the review aimed to identify hazardous driving behaviors, the internal and external factors contributing to these behaviors, and their consequences for traffic safety. Inclusion criteria targeted original research published in English between 2009 and 2024 specifically focused on truck driver behavior and road safety outcomes. Systematic searches across PubMed, Scopus, Web of Science, and IEEE Xplore yielded 104 studies meeting these criteria. The synthesis revealed prevalent risky behaviors—such as speeding, fatigue-related impairments, distracted driving, and substance use—driven by internal factors (e.g., health conditions, psychological stress) and external pressures (e.g., occupational demands, regulatory constraints). These behaviors were consistently associated with increased crash risk. Nonetheless, limitations including the exclusion of non-English studies, reliance on self-reported data, and lack of standardized metrics constrained cross-study comparability and generalizability. Effective interventions identified include fatigue management programs, driver monitoring technologies, and positive safety climates. Findings underscore the urgent need for evidence-based, multifaceted strategies to enhance truck driver safety and inform policy, industry practices, and future research.
