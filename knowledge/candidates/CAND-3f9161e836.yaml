abstract: Conversational AI agents increasingly rely on synthetic speech to interact with users across educational, informational, and service contexts. While prior research suggests that anthropomorphic design enhances social evaluation and trust, less is known about how specific non-verbal vocal cues influence trust formation in voice-based AI systems. Drawing on trust in automation, anthropomorphism theory, expectancy violation theory, and the Technology Acceptance Model, this study investigates whether human-like vocal characteristics enhance or undermine trust in conversational AI agents. Across two controlled experiments, participants evaluated lecture-style audio stimuli produced by either a human speaker or a conversational AI agent voice. Experiment 1 manipulated vocal pitch and speech rate, whereas Experiment 2 examined the inclusion of linguistic fillers (e.g., “um,” “uh”). Results revealed that human speaker voices were perceived as more trustworthy than AI agent voices. Lower vocal pitch increased trust in conversational AI agent voices but not in human voices. Contrary to anthropomorphism-based predictions, linguistic fillers reduced perceived humanness, communicative clarity, and trust. Structural equation modeling further demonstrated that ease of communication—rather than perceived humanness—was the strongest predictor of trust. These findings challenge the assumption that increasing human-likeness uniformly enhances trust in AI systems. Instead, trust appears to depend on calibrated alignment between vocal expressiveness and users’ expectations of machine identity. The study contributes to a more nuanced understanding of trust calibration in voice-based conversational AI and offers design implications for speech-based human–AI interaction.
