abstract: As a physical carrier of human thoughts and values, social media plays a crucial role in the change of contemporary youth's concept of marriage. Given the trend of late marriage among Chinese youth, this study explores the perceptions and attitudes of Chinese youth toward late marriage based on the text mining of the topic of "late marriage" on Sina Weibo. This study finds that the shift in the youth group's perception of marriage has begun to develop toward the aspect of spiritual needs, and that the youth group still generally has a positive attitude toward late marriage. Therefore, it is of great significance to study the perception and attitude of today's youth groups towards late marriage in order to guide them to form a correct view of marriage.
