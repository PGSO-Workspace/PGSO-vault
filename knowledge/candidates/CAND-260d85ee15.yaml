abstract: 'The scientific work posted on the Internet, which its author constantly keeps up to date, will be called an alive publication. The genre of alive publishing has many attractive features. However, it requires a certain expansion of the composition of the meta-attributes of the publication: along with the traditional attributes, the date of the appearance of the new, fresh revision is brought to the fore here. Such date is placed in a prominent place in the text of the publication. Along with this, it becomes highly desirable to include such a dynamically ("on the fly") generated date in a bibliographic reference to an alive publication. The currently used methods of dynamic extraction of this date are considered for a simple online publication, for a publication that has received a DOI through Crossref, for a publication posted in arXiv and in Preprints. Thanks to adding this meta-attribute, references to alive publications will beautify any bibliographic list.'
