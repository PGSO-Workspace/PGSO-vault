title: Unmasking conversational bias in AI multiagent systems
authors:
  - Erica Coppolillo
  - Giuseppe Manco
  - Luca Maria Aiello
year: 2026
venue: PLoS ONE
doi: 10.1371/journal.pone.0355458
url: https://doi.org/10.1371/journal.pone.0355458
abstract: Detecting biases in the outputs produced by generative models is essential to reduce the potential risks associated with their application in critical settings. However, the majority of existing methodologies for identifying biases in generated text consider the models in isolation, overlooking the contextual dynamics of multi-agent systems. In particular, biases emerging from interactions among conversational agents remain largely unexplored. To address this gap, we present a framework designed to quantify biases within multi-agent systems of conversational Large Language Models (LLMs). Our approach involves simulating small echo chambers, where pairs of LLMs, initialized with aligned perspectives on a polarizing topic, engage in discussions. Contrary to expectations, we observe significant shifts in the stance expressed in the generated messages, particularly within echo chambers where all agents initially express conservative viewpoints, in line with the well-documented political bias of many LLMs toward liberal positions. Crucially, the bias observed in the echo-chamber experiment remains undetected by current state-of-the-art bias detection methods that rely on questionnaires. This highlights a critical need for the development of a more sophisticated toolkit for bias detection and mitigation for AI multi-agent systems.
