abstract: Autonomous and generative AI systems are increasingly capable of initiating and executing real-world operational actions across healthcare, finance, infrastructure, and defense domains. Current governance approaches rely primarily on policy frameworks, risk classification models, and post-execution auditing mechanisms, which lack deterministic enforcement at runtime. This gap creates systemic risk where compliance intent cannot be reliably translated into execution-time authority verification. This paper introduces ExecLayer, a runtime enforcement architecture designed to impose deterministic governance constraints on AI-driven system actions prior to execution. ExecLayer resolves natural language or machine-generated operational intent into a declarative intermediate schema termed a Blueprint, which encodes authority chains, permissions, risk classifications, dependency relationships, and execution constraints in a portable and auditable format. The architecture enforces execution gating through cryptographically verifiable Trust Artifacts and Authority Receipts, enabling fail-closed operation and portable compliance validation across distributed and adversarial execution environments. ExecLayer supports both UI-mediated and headless workflow execution while preserving immutable audit lineage and cross-jurisdiction compliance portability. The paper formalizes the Blueprint schema, enforcement pipeline, trust artifact validation model, and adversarial threat assumptions. It further evaluates how deterministic runtime governance may provide a technical substrate for emerging regulatory frameworks including ISO 42001, NIST AI Risk Management Framework, and transnational AI safety standards. ExecLayer demonstrates a shift from advisory governance models toward machine-verifiable authority enforcement, offering a potential reference architecture for operational AI governance infrastructure.
