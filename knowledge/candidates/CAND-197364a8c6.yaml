title: "Implementation of generative AI for the assessment and treatment of autism spectrum disorders: a scoping review"
authors:
  - Jun-Seok Sohn
  - Eojin Lee
  - Jae‐Jin Kim
  - Hans Oh
  - Eun Joo Kim
year: 2025
venue: Frontiers in Psychiatry
doi: 10.3389/fpsyt.2025.1628216
url: https://doi.org/10.3389/fpsyt.2025.1628216
abstract: "Introduction: Autism spectrum disorder (ASD) is characterized by persistent deficits in social communication and restrictive, repetitive behaviors. Current diagnostic and intervention pathways rely heavily on clinician expertise, leading to delays and limited scalability. Generative artificial intelligence (GenAI) offers emerging opportunities for automatically assisting and personalizing ASD care, though technical and ethical concerns persist. Methods: We conducted systematic searches in Embase, PsycINFO, PubMed, Scopus, and Web of Science (January 2014 to February 2025). Two reviewers independently screened and extracted eligible studies reporting empirical applications of GenAI in ASD screening, diagnosis, or intervention. Data were charted across GenAI architectures, application domains, evaluation metrics, and validation strategies. Comparative performance against baseline methods was synthesized where available. Results: From 553 records, 10 studies met the inclusion criteria across three domains: (1) screening and diagnosis (e.g., transformer-based classifiers and GAN-based data augmentation), (2) assessment and intervention, (e.g., multimodal emotion recognition and feedback systems), and (3) caregiver education and support (e.g., LLM-based chatbots). While most studies reported potential performance improvements, they also highlighted limitations such as small sample sizes, data biases, limited validation, and model hallucinations. Comparative analyses were sparse and lacked standardized metrics. Discussion: This review (i) maps GenAI applications in ASD care, (ii) compares GenAI and traditional approaches, (iii) highlights methodological and ethical challenges, and (iv) proposes future research directions. Our findings underscore GenAI's emerging potential in autism care and the prerequisites for its ethical, transparent, and clinically validated implementation. Systematic review registration: https://osf.io/4gsyj/, identifier DOI: 10.17605/OSF.IO/4GSYJ."
