abstract: "Emerging technology topic identification is an important research task in the field of scientific and technological intelligence. To achieve a more comprehensive identification of emerging technology topics, this study proposes a multi-source data fusion framework that integrates three types of data sources: academic publications, patent data, and data from the GitHub open-source platform. In addition, an evaluation indicator system is constructed from four dimensions: growth, novelty, continuity, and impact. During the identification process, the BERTopic topic modeling approach is employed to uncover latent topics within the data, while the entropy weight method is applied for objective weighting, ultimately enabling the identification of emerging technology topics. The results indicate that the identified emerging technology topics include, but are not limited to, large language model-driven intelligent interaction, embodied intelligence perception, context memory management, and multimodal generation. Among the data sources, GitHub data provide earlier signals of technological evolution. Incorporating open-source platform data into the framework can effectively alleviate the lagging issues associated with traditional data sources. The proposed framework provides a more comprehensive research perspective for emerging technology topic identification."
