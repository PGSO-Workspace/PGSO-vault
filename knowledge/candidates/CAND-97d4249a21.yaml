abstract: Large Language Models (LLMs) have shown remarkable capabilities across diverse applications, ranging from text generation to code synthesis.However, these models can also produce biased, harmful or privacy-violating outputs.Over the last few years, an entire ecosystem of guardrails-mechanisms for constraining LLM behavior-has emerged.This review paper offers a comprehensive examination of technical guardrail approaches, focusing on their underlying patterns, current research challenges and future directions.We present a multi-layer taxonomy of guardrails, investigate real-time content filtering and privacy-preserving techniques, discuss adversarial and "jailbreaking" (prompt injection) strategies and explore best practices for building robust, transparent and domain-specific guardrail solutions.By synthesizing recent literature and toolkits (e.g., Nvidia NeMo, Guardrails AI, Llama Guard), we identify pressing open questions and provide guidance for practitioners and researchers aiming to implement LLM guardrails effectively.
