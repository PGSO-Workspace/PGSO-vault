abstract: Abstract Confidential high-performance computing orchestrates workloads across federated domains, yet existing frameworks rely on high-overhead user-space library operating systems or assume single-host execution. We propose JANUS, an architecture federating Trusted Execution Environments via a split Trusted Computing Base design. It couples a hardware-isolated Control Plane executing Mutually Attested Key Exchange with a measured guest-resident extended Berkeley Packet Filter Data Plane. By anchoring cryptographic key release to hardware measurements and executing enforcement in the kernel, JANUS achieves native-speed encrypted routing. Empirical evaluation demonstrates a steady-state enforcement cost of 6 µs per packet, imposing a 13-15 µs absolute latency overhead. On distributed pipelines, JANUS incurs just a 6.1% execution penalty over plaintext baselines, bypassing the 62% penalty of user-space counterparts. The system initializes a 100-node cluster in under 1.5 seconds, providing an efficient confidential interconnect for long-running workflows.
