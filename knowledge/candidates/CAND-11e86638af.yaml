abstract: "Recent studies have explored the manifestation of personality in content generated by large language models (LLMs) and the virtual personality exhibited by these models; however, the evidence supporting these findings remains inadequate. In this work, we verified that the virtual personality of multiple LLMs rely on integrating more psychological expert knowledge to provide further evidence supporting the existence of LLMs' virtual personality, with particular emphasis on two key characteristics of human personality: internal consistency and behavioral tendencies. First, we adopted Test-Retest Reliability (TRR) to evaluate the internal consistency and found that the stability of personality exhibited by LLMs demonstrated the existence of distinct personalities among these LLMs. Subsequently, we developed a more efficient inducion approach with abundant psychological expert knowledge to induce virtual personality in LLMs based on the most comprehensive self-report inventory for personality measurement. Utilizing this approach, we undertook four case studies to illustrate that the LLMs' virtual personality can affect their behavior in a manner analogous to human. We hope this work will provide insights for future research into personalized LLMs."
