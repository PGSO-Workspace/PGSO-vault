abstract: "Abstract Incorporating the sense of touch through haptics in virtual spaces enables people to communicate emotions and engage in more naturalistic and meaningful social interactions. Advances in haptics and virtual reality technologies and applications have been essential to support researchers in the exploration of mediated social touch in virtual environments. The aim of this work is to review the last decade of research on haptics and virtual reality technologies investigating social touch behavior between human avatars as well as between humans and non-human virtual agents. Our systematic review organizes the variety of the conducted research in three dimensions: the context against which mediated social touch is studied, the types of haptics and virtual reality technology used, and empirical studies including data collected and outcome measures. We discuss the results of the analysis of the three dimensions and present implications for future research. We pinpoint the importance of considering in-the-wild studies and emerging issues on social virtual reality; understanding human touch perception for people with different physical and cognitive abilities, and; creating development tools to broaden the exploration of advanced technological setups."
