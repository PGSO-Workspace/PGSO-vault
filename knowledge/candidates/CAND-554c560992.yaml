abstract: The integration of artificial intelligence (AI) in education offers novel opportunities to enhance critical thinking while also posing challenges to independent cognitive development. In particular, Human-Centered Artificial Intelligence (HCAI) in education aims to enhance human experience by providing a supportive and collaborative learning environment. Rather than replacing the educator, HCAI serves as a tool that empowers both students and teachers, fostering critical thinking and autonomy in learning. This study investigates the potential for AI to become a collaborative partner that assists learning and enriches academic engagement. The research was conducted during the 2024–2025 winter semester within the Pedagogical and Teaching Sufficiency Program offered by the Audio and Visual Arts Department, Ionian University, Corfu, Greece. The research employs a hybrid ethnographic methodology that blends digital interactions—where students use AI tools to create artistic representations—with physical classroom engagement. Data was collected through student projects, reflective journals, and questionnaires, revealing that structured dialog with AI not only facilitates deeper critical inquiry and analytical reasoning but also induces a state of flow, characterized by intense focus and heightened creativity. The findings highlight a dialectic between individual agency and collaborative co-agency, demonstrating that while automated AI responses may diminish active cognitive engagement, meaningful interactions can transform AI into an intellectual partner that enriches the learning experience. These insights suggest promising directions for future pedagogical strategies that balance digital innovation with traditional teaching methods, ultimately enhancing the overall quality of education. Furthermore, the study underscores the importance of integrating reflective practices and adaptive frameworks to support evolving student needs, ensuring a sustainable model.
