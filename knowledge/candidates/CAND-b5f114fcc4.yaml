abstract: This chapter introduces interpretive research as a background to research that is time-and context-dependent. The study presents practical, yet theoretical research approaches that are relevant to postgraduate studies and to ad-hoc research. The models proposed as interpretive research designs are development research, design-science research, and design-based research. Systems development, in and of itself, is not research, but when integrated with evaluation and applied both to solve real-world problems and to propose general design principles, it gives rise to development research. Design research – termed design-science research in the domain of information systems (where it has roots in software engineering) and design-based research in educational technology (where the approaches are more pragmatic) – has clearly defined features and methods in each domain respectively. The common attributes are the generation of creative and innovative artifacts to serve in complex situations, and the joint advancement of theory and practice. The three research designs are described, and each is illustrated by an example of a study where the model was applied
