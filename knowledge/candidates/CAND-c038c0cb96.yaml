abstract: "Abstract Background: Intensive longitudinal data (ILD) are increasingly used to monitor within-person psychological dynamics and characterize temporal changes in mental states. One promising approach involves early warning signals (EWSs), such as increases in lag-1 autoregression, which may precede abrupt psychological transitions. However, practical application of EWS approaches remains limited by the lack of principled methods for determining appropriate detection thresholds. Methods: We introduce Threshold-based Change Point Autoregressive Modeling (T-CPAM), a retrospective framework for adaptive threshold determination in EWS detection. T-CPAM integrates sliding-window estimation of early warning indicators with change point autoregressive modeling to evaluate whether candidate thresholds correspond to meaningful temporal changes in the observed time series. Performance was evaluated through Monte Carlo simulations varying noise levels, transition lengths, and window sizes and compared with conventional constant standard deviation (CSD) thresholding approaches. Two empirical illustrations using intensive longitudinal psychological data were further conducted. Results: Across simulation conditions, T-CPAM generally demonstrated more stable detection performance than fixed-threshold methods, particularly under noisier conditions, while maintaining acceptable false positive rates. The empirical illustrations further demonstrated that T-CPAM was capable of retrospectively identifying transition-related temporal changes in both clinical and nonclinical contexts. Conclusions: T-CPAM provides a flexible and interpretable framework for improving retrospective EWS detection when appropriate thresholds are difficult to specify a priori in psychological ILD."
