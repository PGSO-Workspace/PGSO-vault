title: "Agentic AI in Healthcare and Medicine: A Seven-Dimensional Taxonomy for Empirical Evaluation of LLM-Based Agents"
authors:
  - Shubham Vatsal
  - Harsh Dubey
  - Aditi Singh
year: 2026
venue: IEEE Access
