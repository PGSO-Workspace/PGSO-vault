abstract: In this work, we investigate the effects of heterogenization in an α‐diimine nickel catalytic system via installing –OH or –ONa anchoring groups on the ligand structure. The anchoring groups can facilitate facile heterogenization of catalyst on silica. The resulting heterogeneous catalysts led to enhanced thermal stabilities and the improvements of many other parameters, including polymer morphology control, catalytic activity and polyethylene molecular weight. Moreover, the structure and properties of the polymer products can be controlled by catalyst structures, polymerization conditions and heterogenization to achieve good mechanical properties and elasticity. More details are discussed in the article by Chen et al . on page 1155—1162. image
