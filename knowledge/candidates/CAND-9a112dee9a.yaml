abstract: Abstract Emotion Recognition in Conversation (ERC) plays a critical role in enhancing the intelligence and naturalness of human-computer interaction systems. However, existing ERC methods still face significant challenges, particularly in the effective integration of multimodal information and the handling of label noise. To address these challenges, this paper proposes a reliable multimodal conversational emotion recognition model based on a dual-stage attention mechanism (DSA-MERC). DSA-MERC is designed to improve the accuracy and robustness of emotion recognition. In the first stage, the model performs the initial fusion of text, audio, and visual modalities using the Bi-Directional MultiAttention (Bi-MultiAttn) cross-attention mechanism. In the second stage, recognizing the importance of the audio modality in emotional expression, we introduce an audio-guided leader-follower attention network (Audio-LFAN) with a Multi-Scale Attention with Unit Force Operated (MAS-UFO) mechanism. The MAS-UFO framework optimizes multimodal emotion features at multi-granularity levels through multi-scale representation learning, significantly enhancing the model’s ability to capture emotional cues. To address the issue of label uncertainty, we incorporate both Confidence Learning (CL) and Transfer Learning strategies, which effectively filter noisy labels and further enhance the generalization and stability of the DSA-MERC. Experimental results demonstrate that, when compared to existing baseline models, the proposed method yields substantial performance improvements across two widely recognized benchmark datasets, validating its effectiveness and superiority in addressing emotion recognition in conversation task.
