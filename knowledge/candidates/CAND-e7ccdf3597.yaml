abstract: "Karst landscapes and aquifers provide critical ecosystem services: drinking water, biodiversity habitat, climate archives and cultural value. Yet they are uniquely vulnerable to disturbance and contamination. This paper explains why holistic, geoethical access to karst systems is essential for human and non-human life alike and sets out the ethical foundations that justify a practical checklist for fieldwork, research, monitoring, management and public access. The paper is intended as an educational resource for students, practitioners, regulators and funding bodies seeking to align scientific and recreational access with long-term protection of karst systems."
