abstract: This paper presents an in-depth exploration of Human-Robot Collaborative Systems (HRCSs) within industrial environments, a dynamic field that has witnessed significant advancements due to technological innovation and the increasing integration of Artificial Intelligence (AI). As industries evolve towards more collaborative and adaptive manufacturing systems, the dynamic interaction between humans and robots becomes pivotal. This study reviews the current state of HRCSs, focusing on the challenges of task allocation and skill alignment, safety, trust, and the psychological wellbeing of human workers. We review control strategies and architectural frameworks that underpin effective human-robot interactions (HRI), emphasising the critical role of AI in enhancing decision-making processes and the adaptability of collaborative efforts. Our review sheds light on the complexities involved in designing HRCSs that are not only efficient but also cognisant of the human experience, advocating for a balanced approach that leverages the strengths of both human and robotic counterparts. We argue that research in and implications of HRCSs should extend beyond technical considerations, touching on ethical, social, and organisational dimensions, thereby contributing to the broader discourse on the future of work in the era of Industry 4.0 and future Industry 5.0.
