abstract: "The discourse related to the importance of separating scientific and design methods had been occurring since the 1960s, but design thinking gained popularity during the late 2000s alongside theories proposed by IDEO and Stanford Design School in the context of leveraging the competitive advantage of the innovation at Silicon Valley. Since then, design thinking has been applied to other fields outside design. However, as time went by, the effectiveness for designers began to be questioned. To untangle the confusion, this paper explains the history of design thinking and classifies existing methodology into methodology based on: (1) humans; (2) prototypes; (3) combination; (4) new product development, then evaluates them based on the implementation on students’ final projects. In choosing the right methodology, designers must consider: (1) the greater weight between problem or concept exploration; (2) the main focus of innovation lenses; and (3) theoretical approaches that can leverage the design’s added value."
