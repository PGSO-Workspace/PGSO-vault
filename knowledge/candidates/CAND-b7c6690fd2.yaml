abstract: Multimodal Emotion-Aware Automatic Speech Recognition (ASR) systems have emerged as a critical advancement for real-time interaction tasks, enabling systems to not only transcribe speech but also interpret emotional context. This study introduces a novel Multimodal Emotion-Aware ASR framework that effectively integrates acoustic, visual, and textual modalities using advanced fusion techniques. The proposed system employs low-rank tensor fusion and dynamic feature selection, achieving state-of-the-art results across multiple benchmarks. Specifically, the method achieves a Weighted Average F1-Score (WAF) of 85.6% and an Accuracy (ACC) of 87.3% on the MER-SEMI dataset and a WAF of 80.3% with an ACC of 81.7% on the MER-NOISE dataset. Robust five-fold cross-validation results on Train & Val further demonstrate generalizability, with a WAF of 84.3% and an ACC of 86.1%. These results underscore the system’s ability to generalize across diverse languages, including Arabic, and to handle noisy and dynamic environments effectively.
