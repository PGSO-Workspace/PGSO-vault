abstract: The development of efficient, scalable, and interoperable workflow management systems is critical for supporting reproducible research to drive the scientific advancement of earth system modeling capabilities. Many workflow systems targeted for earth system science have been developed to meet that challenge, each having similar capabilities as well as some unique strengths. However, the earth system modeling community now faces additional challenges that impose new requirements. The landscapes of both high performance computing (HPC) environments and numerical modeling are evolving rapidly. HPC systems are composed of a growing diversity of hardware architectures that may be hosted on-prem or by a variety of cloud vendors. Earth model system components are also increasing in diversity as research to augment or replace traditional physics based models with machine learning models progresses. Additionally, a growing diversity of end-users with varying levels of knowledge and expertise require agentic workflows that can respond to their requests. A consequence of this rapid growth in diversity is a growing need to run workflows that span multiple systems in order to optimize data locality and access to resources that maximize performance of specific model components. The availability of, and requirement for, diversity naturally leads to a requirement for federated workflows that effectively harness the computational power of a diverse set of resources distributed both geographically and across multiple administrative domains. In this presentation, we introduce and report our progress with the development of Chiltepin, the first known federated numerical weather prediction workflow system within the National Oceanic and Atmospheric Administration (NOAA). Chiltepin is designed to address key challenges in numerical modeling, particularly those related to sustainable progress in a changing NWP landscape characterized by increasing diversity of technologies and use of high-performance computing resources distributed across both geographical and administrative boundaries.
