title: "UHTP: A User-Aware Hierarchical Task Planning Framework for Communication-Free, Mutually-Adaptive Human-Robot Collaboration"
authors:
  - Kartik Ramachandruni
  - Cassandra Kent
  - Sonia Chernova
year: 2024
venue: ACM Transactions on Human-Robot Interaction
doi: 10.1145/3623387
