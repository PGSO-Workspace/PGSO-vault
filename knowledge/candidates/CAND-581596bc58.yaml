title: How to Promote User Purchase in Metaverse? A Systematic Literature Review on Consumer Behavior Research and Virtual Commerce Application Design
authors:
  - Bingqing Shen
  - Weiming Tan
  - Jingzhi Guo
  - Lin‐Shuang Zhao
