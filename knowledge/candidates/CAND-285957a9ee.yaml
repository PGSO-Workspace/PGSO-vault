abstract: "Embedding a large language model (LLM) agent inside a running desktop application, with direct access to that application&apos;s live objects, requires solving two engineering problems: dispatching agent-generated code onto the application&apos;s main thread safely, and giving that code a namespace connected to the application&apos;s actual running state. Existing agents solve neither: they run as a separate process from the host application, and even when extended into an application&apos;s workflow via a plugin, they cannot reach its main thread, interact with its live GUI, or access its in-memory state — they operate alongside an application, not from inside it. This paper describes ExeCutie, a Python library exposed to the host application as a single Qt dock widget. Behind that widget, the library solves the thread-dispatch problem with a Qt signal-based dispatcher requiring only a running Qt event loop, and solves the namespace problem by reusing the live user namespace of a developer-configured IPython kernel, so the host application — not the library — determines the agent&apos;s scope of access, from a single object to the full namespace. Because the agent executes directly on the main thread, it can synthesize new software at runtime: front-end widgets and their back-end logic generated together and displayed on demand, for functionality absent from the application&apos;s source code until the moment a workflow requires it. In doing so, the boundary between developing an application and using it collapses: the same running process can be extended by whoever is operating it, without a restart."
