abstract: Recent advances in generative artificial intelligence have fundamentally reshaped the engineering of software agents by enabling large language models (LLMs) to serve as a general-purpose cognitive layer for reasoning, planning, and interaction. Unlike traditional agent architectures that relied heavily on symbolic representations and handcrafted rules, LLM-based agents offer flexible, adaptive, and context-aware system behavior; however, they also introduce new architectural and development challenges. In this article, we present an engineering perspective on designing and developing an agentic system built around multiple collaborating LLMs, with an emphasis on architectural modularity, orchestration strategies, and development workflows. Using personalized mental health support as a case study, we describe the architecture and implementation of a multi-LLM agentic system that adapts to users' conversational context and real-world sensory data. We highlight key design decisions, practical challenges, and lessons learned, and offer actionable guidance for practitioners across different stages of agentic system development.
