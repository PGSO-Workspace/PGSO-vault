abstract: The rapid evolution of web technologies and the increasing complexity of modern web applications have introduced significant challenges for test automation engineers. Frequent changes in user interfaces, business logic, and application architecture require continuous maintenance of automated test suites, leading to increased development effort and reduced productivity. At the same time, advances in Artificial Intelligence (AI) create new opportunities for improving software testing through intelligent automation and agent-based assistance. This study investigates the application of the Model Context Protocol (MCP) in web test automation, focusing on the WebdriverIO MCP Server as a mechanism for accelerating automated test development. The research analyzes the capabilities of MCP-enabled AI agents to interact with web applications and generate automated test scenarios in real-world environments. Furthermore, a two-machine development architecture is proposed, where the primary machine is used for main development activities and a secondary machine supports MCP-assisted test generation and exploratory automation, improving workflow efficiency and reducing interruptions. Experimental results demonstrate the practical applicability of the proposed approach. The findings indicate an average MCP session success rate of approximately 80%, suggesting that MCP-based automation can significantly reduce the effort required for developing automated web tests. The study highlights MCP as a promising framework for integrating AI into modern test automation workflows and provides recommendations for its adoption in software quality assurance processes.
