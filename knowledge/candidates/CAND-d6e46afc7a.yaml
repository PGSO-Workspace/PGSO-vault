abstract: "Earthquake catalogues and event metadata are essential for monitoring seis-mic activity, consulting event lists and bulletins, and supporting both op-erational and research workflows. Access to these resources, however, stilltypically assumes users who can address FDSNWS-Event endpoints directlyand interpret tabular or QuakeML responses programmatically. This createsa practical obstacle as conversational interfaces and agent-based systems areincreasingly used for earthquake-related tasks, while requiring tools that arediscoverable, schema-driven, and easy to reuse across multiple interactionturns. mcp-fdsnws-event addresses this interoperability problem by ex-posing FDSNWS-Event web services as structured Model Context Protocol(MCP) tools. The server provides six read-only tools covering event search,single-event detail, arrivals, magnitudes, origins, and focal mechanisms. Itsimplementation combines two access paths: compact catalogue queries areexecuted through the FDSNWS-Event format=text interface, while eventdetail is retrieved as QuakeML and serialized through ObsPy. The softwaresupports multiple FDSN-compliant datacenters through a single parameter-ized interface, ships as a Docker container, and optionally exposes the sameMCP tools through an OpenAPI/REST wrapper for web clients. Validationis supported by offline unit tests, live integration tests against INGV, anMCP protocol smoke test, and a standalone harness for assessing client-sideevent identifier reuse in multi-turn interactions. The resulting software pro-vides a standardized bridge between established seismological web servicesand the emerging ecosystem of MCP-enabled AI applications."
