abstract: This paper presents an AI Code Reviewer system designed to enhance software development workflows through real-time code analysis and automated GitHub integration. The system provides an interactive coding environment where developers receive immediate AI-powered feedback on syntax errors, security vulnerabilities, and optimisation opportunities. As users write code, artificial intelligence continuously reviews the content, offering suggestions to improve code quality and adherence to best practices. The system in- corporates an MCP (Model Context Protocol) server that enables natural language interaction, allowing developers to query the AI model for specific improvements. Our implementation utilises a dual-model architecture combining the Cerebras and Groq models to enhance response accuracy through iterative refinement. Upon completion, the AI agent automatically pushes reviewed code to GitHub repositories using secure access tokens. This end-to-end automation bridges the gap between code development and version control, reducing manual steps and deployment errors. Experimental evaluation demonstrates significant improvements in code quality and development efficiency compared to traditional review methods.
