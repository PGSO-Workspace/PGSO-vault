abstract: We design a lightweight runtime monitor that enforces API-call policies for programs generated by large language models. The monitor uses syscall tracing and taint propagation to detect forbidden behavior, including unsafe file access, insecure crypto choices, and untrusted deserialization. Evaluations on 400 LLM-generated programs show that runtime enforcement blocks 92% of dangerous behaviors without requiring code modification. Performance overhead remains below 7% on average. Complementing static or pre-generation safeguards, runtime policy enforcement offers a robust last line of defense.
