abstract: "<div> We present the first systematic benchmark of GPT-SoVITS, an open-source few-shot text-to-speech system, running entirely on consumer Apple Silicon hardware. We identify and resolve seven critical platform incompatibilities, including pervasive float16 precision errors across training, inference, and API serving pipelines. Using a MacBook Pro with an M4 Pro chip (24GB unified memory), we fine-tune a voice model on 37 minutes of English speech data and achieve training completion in approximately 70 minutes. We further construct a streaming voice agent pipeline combining speech-to-text, a local large language model, and our fine-tuned GPT-SoVITS model, achieving a measured first-audio latency of 1,557 milliseconds. Our complete toolkit, including automated platform patches and deployment scripts, is released as open source. </div> <div> <br> DOI: https://doi.org/10.5281/zenodo.19458410 <br><span>Code: https://github.com/akhilsingh-git/voice-clone-toolkit</span> </div> <div> <br> </div>"
