abstract: The integration of large language models (LLMs) with external tools has catalyzed a paradigm shift in automating statistical data analysis. Unlike general-purpose AI agents, tool-augmented statistical agents must navigate the intricate interplay between probabilistic reasoning, domain-specic computing ecosystems, and rigorous reproducibility standards. This study provides a focused review of recent advances in tool-augmented LLM agents tailored for statistics and data science. We examine three core architectural paradigmscode generation, retrieval-augmented generation, and interactive tool useand analyze their respective strengths in addressing statistical inference tasks. Particular emphasis is placed on the integration of LLM agents with the R statistical ecosystem, the challenges of evaluating agents on real-world data science problems, and the emerging benchmark suites designed to measure statistical reasoning delity. We additionally propose a taxonomy that classies existing systems along the dimensions of reasoning depth, tool interface granularity, and knowledge grounding strategy, oering a structured lens through which to assess the maturity of the eld.
