title: A Cross-Cultural Investigation of Prejudice Against Transgender People
authors:
  - Jaime L. Napier
year: 2024
venue: Social Psychological and Personality Science
doi: 10.1177/19485506241289638
url: https://doi.org/10.1177/19485506241289638
abstract: The current research offers a cross-cultural examination of transgender prejudice, with a particular focus on the role of gender. Analyses of a survey conducted in 23 countries (with N ’s ranging from 485 to 1,098) representing both Western and non-Western societies showed that there is greater bias toward transgender women (vs. men) overall, among both male and female participants. These differences were small and not reliable in most Western countries, whereas participants in China, Russia, South Korea, and Türkiye made greater distinctions. Men (vs. women) and conservatives reported higher prejudice, and this was more pronounced in Western (vs. non-Western) countries. Religiosity was associated with anti-transgender prejudice in Western (but not non-Western) countries, but this was completely accounted for by anti-gay attitudes. Finally, anti-gay and anti-transgender prejudice were strongly related to each other across samples, and the denial of gender identity predicted anti-transgender prejudice over and above anti-gay prejudice.
