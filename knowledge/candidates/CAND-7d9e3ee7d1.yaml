title: "Hope: The experience and functions of a seemingly-positive group-based emotion"
authors:
  - Smadar Cohen‐Chen
  - Ruthie Pliskin
year: 2024
venue: European Review of Social Psychology
doi: 10.1080/10463283.2024.2347815
url: https://doi.org/10.1080/10463283.2024.2347815
abstract: "Hope has intrigued and attracted humans for centuries, with views on this emotion ranging from extremely positive to extremely negative. To deepen and nuance our understanding of hope – a seemingly positive emotion – we apply to it a valence/function framework of emotion in group-based contexts. This framework facilitates the examination and categorisation of emotions as positive or negative along two orthogonal dimensions: the pleasantness of the emotional experience and their social outcomes. According to this framework, emotions can “move” on both dimensions (i.e. be experienced as pleasant or unpleasant and lead to functional versus dysfunctional outcomes), based on various factors. Applying this framework to group-based hope may seem surprising, as the emotion is often considered universally good. Yet a more nuanced approach reveals situations in which group-based hope can be a “do bad” emotion, and, at times, can even “feel bad.” We discuss the implications of these understandings for research on hope and its applications across different group contexts."
