abstract: Although several food-related fields have yet to fully grasp the speed and breadth of the fourth industrial revolution (also known as Industry 4.0), growing literature from other sectors shows that Industry 5.0 (referring to the fifth industrial revolution) is already underway. Food Industry 4.0 has been characterized by the fusion of physical, digital, and biological advances in food science and technology, whereas future Food Industry 5.0 could be seen as a more holistic, multidisciplinary, and multidimensional approach. This review will focus on identifying potential enabling technologies of Industry 5.0 that could be harnessed to shape the future of food in the coming years. We will review the state-of-the-art studies on the use of innovative technologies in various food and agriculture applications over the last 5 years. In addition, opportunities and challenges will be highlighted, and future directions and conclusions will be drawn. Preliminary evidence suggests that Industry 5.0 is the outcome of an evolutionary process and not of a revolution, as is often claimed. Our results show that regenerative and/or conversational artificial intelligence, the Internet of Everything, miniaturized and nanosensors, 4D printing and beyond, cobots and advanced drones, edge computing, redactable blockchain, metaverse and immersive techniques, cyber-physical systems, digital twins, and sixth-generation wireless and beyond are likely to be among the main driving technologies of Food Industry 5.0. Although the framework, vision, and value of Industry 5.0 are becoming popular research topics in various academic and industrial fields, the agri-food sector has just started to embrace some aspects and dimensions of Industry 5.0.
