abstract: "Introduction: In the field of human psychology, the study of personality traits was a major research endeavour extending over several decades. Considering personality as stable, underlying dimensions that influence behaviour, a similar construct can be assumed in large language models (LLMs). However, most research in the field of machine personality relies on unverified assumptions or is afflicted by methodological weaknesses. The present work is the first to present a psycho-lexical analysis of machine personality.Methods: The psycho-lexical approach together with an exploratory factor analysis was adopted. Interview-like interactions were conducted with various LLMs (N = 400), and their behaviour was evaluated using a set of adjectives commonly used to describe personality traits. The ratings were subjected to an exploratory factor analysis to extract LLM-specific personality factors.Results: Five stable factors were extracted and interpreted. The five factors were termed Antagonism, Spirit, Conscientiousness, Negative Introversion, and Simple-Mindedness.Conclusion: The present work addresses the lack of systematic and fundamental approaches to the study of personality in LLMs. It is the first to present an LLM-specific factor structure of personality, suggesting that humans and LLMs exhibit different personality traits."
