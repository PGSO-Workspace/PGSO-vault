abstract: This concise overview paper discusses our recent work developing the Inside Out Model of Emotion Recognition – a psychological framework bringing together the experience, visual representation and recognition of emotion. Via this work, we have identified two distinct pathways to emotion recognition difficulties. We highlight our model’s implications for understanding the aetiology of emotion recognition challenges across various clinical conditions.
