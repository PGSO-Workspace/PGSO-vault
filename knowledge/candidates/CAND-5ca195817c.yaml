abstract: Accurately retrieving entity knowledge aligned with user intent is a critical requirement for task-oriented dialogue (TOD) systems, particularly in scenarios involving large-scale knowledge bases where personalization and localization are essential. Existing generative approaches often exhibit implicit association bias, while retrieval-generation pipelines suffer from knowledge transfer inconsistencies. To address these issues, we introduce CaTER, a Context-aware Topology Entity Retrieval Contrastive Learning framework that unifies entity retrieval and response generation. CaTER incorporates a cycle context-aware distilling attention mechanism, leveraging context-independent sparse pooling to mitigate noise from weakly relevant attributes. In addition, it constructs topologically hard negative samples by decoupling entity information from generated responses and optimizes the retriever via a topology entity retrieval contrastive loss with reverse distillation. Comprehensive experiments on three widely used TOD benchmarks under both small- and large-scale knowledge base settings demonstrate that CaTER consistently outperforms competitive baselines, including MAKER and MK-TOD, and achieves state-of-the-art performance across multiple evaluation metrics. Additionally, CaTER extends the entity-aware alignment distillation method, which called CaTER++, to further address knowledge transfer bias in retrieval-from-generation tasks.
