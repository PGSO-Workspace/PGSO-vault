abstract: The rapid proliferation of agentic artificial intelligence (AI) has necessitated standardized protocols for tool invocation and contextual state management. The Model Context Protocol (MCP) has recently emerged as a foundational architecture, bridging the non-deterministic reasoning capabilities of large language models (LLMs) with external data sources, isolated execution environments, and discrete algorithmic tools. However, the federated nature of the MCP ecosystem introduces profound and systemic security vulnerabilities, most notably transitive privilege escalation, indirect prompt injection, and catastrophic multi-agent supply chain compromises. This comprehensive research report presents an exhaustive formal and empirical analysis of MCP security vulnerabilities, contextualizing the threat landscape through the adaptation of classical cryptographic attacker models. By formalizing the agent skill ecosystem under the domain-specific DY-Skill attacker model, this research mathematically defines the vectors of supply chain exploitation. Furthermore, the report rigorously evaluates deterministic mitigation strategies, contrasting traditional probabilistic heuristic defenses with structural implementations such as Information-Flow Control (IFC), Permissive Information-Flow Analysis (PIFA), and decentralized cryptographic Object-Capabilities (O-Caps) utilizing chained Hash-based Message Authentication Code (HMAC) Macaroons. Through a containerized laboratory evaluation integrating Z3 Satisfiability Modulo Theories (SMT) solvers and live orchestrator telemetry, this research demonstrates both the active exploitation of a Confused Deputy vulnerability via semantic laundering and the mathematical efficacy of cryptographic session validation. The synthesized findings provide a definitive, multi-layered blueprint for securing the next generation of federated AI architectures against complex adversarial manipulation.
