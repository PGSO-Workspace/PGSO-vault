abstract: "Objective: To explore the latent classes of smartphone dependency among college freshmen and analyze the predictive factors of these classes, to provide a basis for the development of targeted intervention strategies. Methods: A total of 4,863 college freshmen from Zhejiang A&F University in 2023 were selected for the questionnaire survey by using the Socio-demographic information, Smartphone Dependency Scale and Psychological Resilience Scale, followed by latent profile analysis and logistic regression for data analysis. Results: oup (10.1%). Negative life events, suicidal ideation, and psychological resilience were significantly associated with the latent classes of smartphone dependency among college freshmen. Conclusion: There is heterogeneity in smartphone dependency among college freshmen, those experiencing suicidal ideation exhibit increased sensitivity to smartphone dependency, those encountering negative life events are more prone to smartphone dependency, while psychological resilience acts as a protective factor against smartphone dependency among college freshmen. These insights not only enhance our understanding of the characteristics of smartphone dependency among college freshmen, but also provide a scientific basis for psychological health education and personalized interventions."
