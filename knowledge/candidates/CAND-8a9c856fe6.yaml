abstract: We examined perceived empathy in a human-voice agent interaction and hypothesized that empathy shown by the voice-agent and human would be perceived by human participants and the situational context will affect the level of empathy perceived. Participants viewed eight videos while in the fMRI scanner across two contexts (plan-a-trip, visit-to-a-nutritionist) and four empathy conditions, and rated perceived empathy after each video on a 4-point Likert Scale. Results showed comparable perceived empathy from the voice-agent and human actor and greater level of empathy from the human actor while responding to human being empathetic. However, different neural regions supported empathy perceived from human (dorsomedial prefrontal) compared to the voice-agent (left superior temporal gyrus). The ‘trip’ context marked the equivalence in perceived empathy from human and voice-agent whereas higher empathy ratings from the human actor were observed across both contexts. BOLD activations were associated with mentalizing aspects of empathy for the trip context and affective empathy for the nutritionist context. Brain regions coding for cognitive-evaluative and affective empathy supported perceived empathy from the voice-agent whereas regions coding for affective empathy from the human actor in the nutritionist context. This study highlights the potential for a collaborative human-voice agent communication with implications for health-care.
