abstract: "Enterprise AI remains structurally weak at the execution boundary: the interval between a machine-derived output and the operational act that affects money, rights, or compliance obligations. Current governance approaches operate around models, not within the decision path. This paper argues that post-hoc governance is insufficient for regulated environments and proposes Artificial Decision Intelligence Systems (ADIS) as a category designed to govern the execution boundary through deterministic, auditable, policy-bound runtime judgment. Seven formal properties distinguish ADIS from neighboring paradigms. Decision anatomy explains cross-sector transferability. Bounded operational evidence supports the architectural argument. The paper concludes that governance within the decision path is an architectural prerequisite for scaling AI into consequential operations."
