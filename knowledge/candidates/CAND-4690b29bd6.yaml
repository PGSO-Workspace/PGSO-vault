abstract: Abstract Initially designed to protect intellectual property (IP) of digitalized information goods such as music, games, or books, existing centralized digital rights management (DRM) systems mostly serve the interests of major publishers, with scant inclusion of rights owners, creators, and consumers. Although various blockchain-based DRM systems have been proposed, most of them mirror existing counterproductive IP restrictions. Analyzing the music industry as a case in point, this paper proposes design principles for blockchain-based DRM systems that provide an integrated and flexible solution by enabling transparent music licensing structures, consistent and complete rights metadata, and efficient and transparent royalty payout. The solution can be achieved by storing rights metadata on a public distributed ledger, by validating metadata through a consensus mechanism on a permissioned blockchain, and by algorithmically enforcing royalty payout via stablecoin through a smart contract. The design principles were evaluated by industry experts, validating their benefit for the music industry by increasing surplus value that is currently destroyed through previous suboptimal designs.
