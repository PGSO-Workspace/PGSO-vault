abstract: The evolution of large language models (LLMs) from passive text generators to autonomous agents capable of invoking external tools, accessing databases, executing code, and interacting with digital environments has significantly expanded their practical utility across diverse domains. While tool-calling architectures enhance problem-solving capabilities and enable dynamic decision-making, they also introduce complex governance and accountability challenges that extend beyond traditional concerns associated with standalone LLMs. Autonomous agents can perform multi-step actions with limited human intervention, creating new risks related to transparency, responsibility attribution, security vulnerabilities, privacy violations, and unintended consequences. This paper critically examines the governance implications of tool-calling LLM agents, focusing on the tension between increased autonomy and the need for effective oversight. The study explores key accountability issues, including decision traceability, auditability, explainability, human-in-the-loop control, regulatory compliance, and liability allocation among developers, deployers, and end users. Furthermore, it analyzes emerging governance frameworks and technical safeguards designed to ensure trustworthy agent behavior in high-stakes environments such as healthcare, finance, cybersecurity, and public administration. The paper argues that existing governance mechanisms developed for conventional AI systems are insufficient to address the operational complexity of autonomous tool-using agents. A multidimensional governance approach integrating technical controls, organizational policies, ethical principles, and regulatory standards is therefore proposed. The findings contribute to ongoing discussions on responsible AI deployment by highlighting pathways for balancing innovation, autonomy, and accountability in next-generation intelligent systems.
