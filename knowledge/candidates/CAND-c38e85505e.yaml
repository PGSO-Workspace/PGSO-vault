abstract: Com a baixa representatividade feminina em áreas de tecnologias da informação, o presente artigo faz uma análise do cenário de mulheres em ambientes colaborativos de código aberto. Para a pesquisa foram analisadas duas comunidades no GitHub e selecionados quatro repositórios. Apesar dos desafios e da baixa representação, observa-se um aumento gradual na participação das mulheres ao longo do tempo, ressaltando a necessidade contínua de políticas e iniciativas que promovam a igualdade de gênero nessas comunidades. Um dos achados desta pesquisa mostra que em um repositório específico para mulheres, elas realizaram 83.33% dos comentários, enquanto nos demais repositórios a participação delas é de cerca de 5.56%, apesar do percentual de mulheres ser praticamente igual ao de homens. Considera-se ainda a importância de pesquisas qualitativas futuras para compreender as motivações e desafios enfrentados pelas mulheres nessas áreas.
