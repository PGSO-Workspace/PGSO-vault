abstract: Artificial intelligence is increasingly used for code generation, automated review, defect detection, and refactoring, yet evidence remains divided on whether such assistance improves enduring software quality or primarily accelerates production. This study specifies a reproducible empirical evaluation of artificial intelligence-assisted refactoring using production code from licensed public Python repositories on GitHub. A repeated measures design will compare each source code unit before and after a standardized model intervention. Functional preservation will be evaluated through the repositories’ existing automated tests. At the same time, maintainability index, cyclomatic complexity, source lines of code, linting violations, code smells, and security findings will provide complementary quality measures. The study introduces the Artificial Intelligence Refactoring Quality Evaluation Framework, which integrates repository selection, baseline characterization, controlled prompting, functional verification, static analysis, and paired statistical inference. Failed transformations, test regressions, nonexecuting outputs, and unfavorable quality tradeoffs will remain in the analytical dataset to prevent survivorship bias. By extending earlier conceptual research into a transparent repository grounded investigation, the study seeks to identify the conditions under which artificial intelligence improves maintainability without compromising correctness, security, or traceability. A public replication package will support independent verification, model comparison, cross-language extension, and future longitudinal evaluation.
