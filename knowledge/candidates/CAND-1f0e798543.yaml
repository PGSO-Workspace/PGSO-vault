title: "Trusting and Working with Robots: A Relational Demography Theory of Preference for Robotic over Human Co-Workers"
authors:
  - Sangseok You
  - Lionel Robert
year: 2024
venue: MIS Quarterly
doi: 10.25300/misq/2023/17403
url: https://doi.org/10.25300/misq/2023/17403
abstract: Organizations are facing the new challenge of integrating humans and robots into one cohesive workforce. Relational demography theory (RDT) explains the impact of dissimilarities on when and why humans trust and prefer to work with others. This paper proposes RDT as a useful lens to help organizations understand how to integrate humans and robots into a cohesive workforce. We offer a research model based on RDT and examine dissimilarities in gender and co-worker type (human vs. robot) along with dissimilarities in work style and personality. To empirically examine the research model, we conducted two experiments with 347 and 422 warehouse workers, respectively. The results suggest that the negative impacts of gender, work style, and personality dissimilarities on swift trust depend on the co-worker type. In our experiments, gender dissimilarity had a stronger negative impact on swift trust in a robot co-worker, while work style and personality had a weaker negative impact on swift trust in a robot co-worker. Also, swift trust in a robot co-worker increased the preference for a robot co-worker over a human co-worker, while swift trust in a human co-worker decreased such preferences. Overall, this research contributes to our current understanding of human-robot collaboration by identifying the importance of dissimilarity from the perspective of RDT.
