abstract: "The thermal resistance of a borehole heat exchanger (BHE) varies significantly depending on the position of the pipe legs. However, the pipe position cannot be fully controlled during its construction because of extreme slenderness of BHEs. As a result, the borehole thermal resistance (R<sub>b</sub>) estimated from one BHE cannot represent the entire borefield. This study probabilistically quantified the uncertainty of R<sub>b</sub> caused by the inherent uncertain characteristics through Monte Carlo simulations. The following four scenarios were considered: <br><br>1) pipe legs move along the central axis of the borehole, <br><br>2) insertion of a U-tube using spacers to maintain the shank spacing, <br><br>3) pipe legs freely located inside the borehole, and <br><br>4) considering uncertainty of the pipe location, borehole radius, and thermal conductivities of the grout and ground. <br><br>The results demonstrated that the use of spacers significantly improves R<sub>b</sub> and reduces its uncertainty range. The results of the last scenario revealed that the maximum R<sub>b</sub> could be more than twice the minimum value. Moreover, the spatial variation of R<sub>b</sub> according to the pipe position was systematically analyzed to clarify the dynamics of <sub>b</sub> change. The results suggest that R<sub>b</sub> obtained through a thermal response test cannot adequately represent the entire borefield."
