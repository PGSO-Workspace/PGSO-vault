title: The Role of DEI and Meaningful Work in the Relationship Between CSR and Organizational Commitment
authors:
  - José Manuel González‐Soberado
  - M. Odriozola
year: 2026
venue: Business Strategy & Development
doi: 10.1002/bsd2.70276
url: https://doi.org/10.1002/bsd2.70276
abstract: ABSTRACT The aim of this paper is to determine whether corporate social responsibility (CSR) practices have a positive effect on employees' organizational commitment, considering diversity, equity, and inclusion (DEI) as a mediating variable and meaningful work as a moderating variable in this relationship. The empirical analysis used the methodology of structural equation modelling (SEM) with data from a questionnaire conducted with the employed population in Spain and Portugal, which yielded 315 responses. The results reveal a direct positive impact of CSR practices on employees' organizational commitment. Furthermore, CSR initiatives implemented by organizations contribute to enhancing DEI within the company, and this combined effect leads to a significant increase in employee engagement. However, the moderating effect of the meaningful work variable in this relationship is not confirmed.
