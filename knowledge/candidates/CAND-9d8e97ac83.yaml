venue: British Educational Research Journal
doi: 10.1002/berj.4118
url: https://doi.org/10.1002/berj.4118
abstract: Abstract Constructing personalised and effective online language learning models based on individual personality differences is crucial in the field of education. However, there is little research on how to apply these models to students in science and engineering who have varying personality profiles. This study aimed to assess the validity of the Online Language Learners' Characteristics Model Questionnaire and investigate how its structure and performance differ among individuals with different personality traits. A total of 1015 college students completed a pen‐and‐paper questionnaire in online classes. The results showed that online characteristics were explained by a five‐factor model consisting of language learning strategy, attitude, motivation, causal attribution, and self‐efficacy. A latent profile analysis was conducted to identify four distinct personality profiles. Measurement invariance and differences in characteristics among the four personality types were examined. Our findings offer initial evidence of the specific connections between personality traits and online language learning characteristics at the individual level.
