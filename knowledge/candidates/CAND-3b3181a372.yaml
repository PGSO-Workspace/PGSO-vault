abstract: "Autonomous and agentic AI systems increasingly operate through long-running, tool-mediated, and context-adaptive processes that challenge conventional governance assumptions. Existing AI governance models remain largely centered on static licensing, periodic compliance assessment, and post-hoc incident reporting. While such approaches are suitable for relatively stable systems, they are increasingly insufficient for autonomous AI agents whose operational risk profiles may evolve during deployment. This paper proposes a theoretical extension of static licensing toward a runtime governance model for autonomous AI systems. The core claim is that agentic systems require a state-based permission lifecycle rather than one-time authorization or static consent. To formalize this approach, the paper introduces three connected elements: a permission state space, a dynamic risk update function, and a state transition rule governing runtime changes in authorization status. In addition, the framework incorporates a conditional reinstatement model to explain how suspended systems may return to operation after remediation, audit, and re-evaluation. The proposed model contributes to AI governance theory in three ways. First, it reconceptualizes licensing as a revisable runtime permission condition rather than a fixed entry decision. Second, it extends closed-loop governance into a runtime permission control architecture suited to autonomous agents. Third, it strengthens the theoretical basis of dynamic permission control by clarifying the interpretation of risk parameters, the institutional role of governance thresholds, and the comparative distinctiveness of runtime permission control relative to conventional staged oversight regimes. The framework is intended as a working theoretical model rather than a complete regulatory program. It does not address AGI in general, firm-specific critique, or API-level implementation details. Instead, it provides an institutionally plausible formal architecture for runtime permission control that may support future empirical validation, cross-jurisdictional modeling, and more advanced adaptive risk updating in autonomous AI governance."
