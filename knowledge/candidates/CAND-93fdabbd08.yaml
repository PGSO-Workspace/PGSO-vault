abstract: Abstract As new topics emerge, users often struggle to find relevant and reliable information due to evolving terminology, ambiguous queries, and a lack of indexed resources. Traditional search engines may fail to capture the context and intent behind such searches, leading to suboptimal results. This study explores how Large Language Models (LLMs) can enhance query expansion and understanding of emerging topics, ensuring more effective and meaningful information retrieval. By leveraging context-aware query reformulation, semantic enrichment, and interactive refinement, LLMs can dynamically adapt search queries to improve recall, relevance, and ranking. This is particularly valuable in rapidly growing fields such as public health, finance, disaster response, and technology, where new terms and concepts emerge frequently. Our approach integrates query expansion, and neural reranking techniques to refine search intent and deliver more accurate results. The goal of this research is to develop a more adaptive, intuitive, and intelligent search framework that enhances the user experience by making web searches more precise, context-aware (Expand queries based on context rather than similarity), and informative, benefiting both general users and domain experts.
