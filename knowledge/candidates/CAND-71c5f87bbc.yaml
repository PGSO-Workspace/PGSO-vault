abstract: Generative AI adoption is outpacing reliable productionization in enterprise workflows that combine structured inputs, policy constraints, and operational risk. This technical report presents a prompt-first architecture for chargeback automation and agentic decision support that replaces brittle, retrieval-heavy integrations with a governed orchestration layer for prompt management, policy enforcement, evaluation, and observability. Using chargeback dispute handling as a case study, the report analyzes a transition from Retrieval-Augmented Generation (RAG) to modular prompt chaining and agentic execution over structured case inputs. In internal deployment measurements, the redesigned system reduced generation latency by 35%, improved internal quality scores by 20%, enabled near-immediate policy updates without re-indexing, and auto-resolved 85% of policy issues before human review. Reviewer agreement improved from Cohen’s kappa 0.65 to 0.82 across three optimization cycles. The results suggest that, for decision-grade automation over structured enterprise data, governed prompt orchestration can outperform more complex retrieval-heavy designs in speed, controllability, and operational fitness. Some system names and implementation details are generalized for confidentiality.
