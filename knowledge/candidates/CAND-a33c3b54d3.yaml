abstract: "The greater acceptance of gay, compared with transgender, people in Western countries may be a result of a specific trajectory—where queer rights was centered by and around White, middle class, gender-conforming gay men—and may not generalize to other places. Two surveys of respondents in 23 countries ( Ns∼ = 500 or 1,000 per country) showed that bias toward gay and transgender people is lower in Western (vs. non-Western) countries, but that the relative bias changes as a function of region: there is greater acceptance of gay (vs. transgender) people in most Western countries, whereas the reverse is true in most non-Western countries. Analyses of legal frameworks ( N = 193) show that recognition of same-gender unions is prevalent in Western countries but virtually nonexistent elsewhere, whereas recognition of gender marker changes is prevalent throughout the world. Overall, in the most intolerant places, transgender people are relatively more accepted than gay people."
