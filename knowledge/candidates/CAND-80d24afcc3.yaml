abstract: Design Science (DS) has become an established research paradigm in Information Systems (IS) research. However, existing research still considers it as a challenge to publish DS contributions in top IS journals, due to the rather strict guidelines that DS publications are expected to follow. Against this backdrop, we intend to emphasize the myriad of configurations and empirically describe the status-quo of DS publications in IS. Based on a Systematic Literature Review (SLR) and a conceptually derived analysis frame, we empirically analyze DS papers published in the AIS Senior Scholars’ Basket. Thereby, we intend to contribute conceptually and descriptively to the knowledge base of DS, by providing insights based on empirical evidence to aid and guide the discussion towards the advancement of the field. Overall, this shall lay the descriptive foundation for creating prescriptive knowledge on DS in IS by proposing and opening future research avenues.
