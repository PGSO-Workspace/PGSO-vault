abstract: "UAT/UPC - NEW SEPARATE REPOSITORY - PROPOSAL ONLY ============================================== Title: Two Methods to Obtain Rgeom=0.279182 - Static 43.515° vs 45°+0.046 Hz/day drift DISCLAIMER: THIS IS A PROPOSAL IN DEVELOPMENT, NOT EXPERIMENTALLY VALIDATED. Only theory + numerical simulation. Lab log 3.697/13.24=0.2792 requires independent replication. This is a NEW SEPARATE Zenodo repository to avoid mixing with validated records. References: - Closure: DOI 10.5281/zenodo.22219221 - Cierre completo del marco UAT/UCP: Lagrangiano con η≡κcrit=4,978, Ωm^eff=0,3133, Rgeom=0,279182, rd=128,15 Mpc vs 141 Mpc Proxy - https://doi.org/10.5281/zenodo.22219221 - Historical 8+1 calibration: DOI 10.5281/zenodo.19646359 v5 (26 March 2026) - will be attached as supplementary_historical_8plus1.zip Contents of this ZIP: - calculations_both_methodologies.py - METHODOLOGY_UAT_UPC_Proposal.pdf (with strong disclaimer and both DOI references) - FIELD_EQUATIONS_UAT_CORRECTED.pdf - This README The author will add supplementary_historical_8plus1.zip containing old development (uat_8plus1_detector_calibration_final.py, uat_8plus1_detector_calibration_previa.py, Nota_Tecnica_18_04_26.pdf, code_python.txt, calibrated_central_coil_signal.png) as historical reference. How to cite: Percudani, M. (2026). Proposal: Two Methods to Obtain Rgeom=0.279182. Zenodo, New Repository, Proposal in Development. Refs: 10.5281/zenodo.22219221 and 10.5281/zenodo.19646359 (historical supplementary). Key contemporary reference for synthetic rotation: Fleury et al., Science 343, 516-519 (2014) DOI 10.1126/science.1246936"
