abstract: Abstract Information behavior and practices (IBP) research has been repeatedly criticized for having little impact on information systems development (ISD). Claiming that there is a complete disconnect would be an exaggeration but it is apparent that it is not always easy to translate findings of IBP research to workable design recommendations. Based on a reading of earlier literature and a closer investigation of three illustrative example contexts, this article underlines that the value of IBP research for ISD lies in its capability to inform ISD of the variety of ways people deal with information beyond individual systems, their own wants and designers' assumptions. Moreover, it highlights that the implications of information systems go beyond their primary users. Instead of overemphasizing the contextuality of findings, a part of IBP research would benefit from an increased focus on explicating its epistemological extents and limits and identifying, which findings are transferable, what distinguishes specific contexts, what are their defining constraints and priorities, and what aspects of their uniqueness are assumptions and simple clichés.
