abstract: "Prompt engineering has become the default strategy for building LLM agents, but its success has obscured a deeper architectural problem. As tasks become more complex, promptcentric systems repeatedly reconstruct cognition from scratch through monolithic or loosely structured interactions. This works surprisingly often, but it does not scale well in composability, observability, control, or reuse. In that sense, prompt engineering is not just an incomplete solution; it is a structural dead end for robust agent systems. In engineered systems, complex work is not performed by re-deriving procedures at every execution. It is performed through structured, reusable, and governable processes. We argue that LLM agents should follow the same principle: cognition should be treated as a reusable asset rather than as an ephemeral byproduct of prompting. To address this gap, we introduce ORCA (Open Cognitive Runtime for Agents), a conceptual and architectural framework that separates cognition from execution. ORCA models cognition as explicit semantic units (capabilities), organized through declarative workflows (skills), and executed via a decoupled runtime layer with structured state and dynamic bindings. This makes cognitive processes inspectable, composable, reusable, and governable independently of their underlying implementations. We formalize the core primitives of the ORCA framework and present a reference implementation showing how structured cognitive execution improves traceability, composability, and execution control, while introducing additional orchestration overhead. Through comparative analysis against prompt-based approaches, we characterize these trade-offs and argue that the next generation of reliable LLM agents will be defined less by better prompts than by the emergence of cognitive runtimes. A reference implementation of the ORCA runtime is available as open source at https: //github.com/gfernandf/agent-skills."
