abstract: "Abstract Tool-using large language model (LLM) agents exercise authority over protected resources through APIs, tools, credentials, and external services. Existing evaluations often measure prompt resistance, tool selection, call admission, or benchmark success, but those observations do not necessarily justify stronger claims about preventing unauthorized protected-resource effects. This structured review introduces authorization assurance as a claim-centered lens relating asserted security properties to their required obligations, enforcement semantics, evidence, observation points, and residual assumptions. A 75-reference evidence library supported a closed analytical corpus of 30 full-text sources decomposed into 92 Source–Claim Records: a 15-source strict agent core, a six-source sensitivity layer, and nine authorization/assurance comparators. In the strict core, all three sources relevant to least privilege reduced available authority rather than measuring effective privilege across the execution trajectory; mediation claims spanned materially different enforcement and observation boundaries; and every source retained at least one material residual assumption. No evaluable revocation-assurance claim appeared among the 21 agent-focused sources, and no evaluable delegation-containment claim appeared in the 30-source corpus. The synthesis also shows that final-state correctness is not equivalent to authorization correctness and that assurance is compositional rather than determined by a single evidence modality. On this empirical basis, the review contributes the Minimum Authorization-Assurance Profile (MAAP), a novel evidence-derived analytical reporting profile that operationalizes claim scope, enforcement boundaries, effect-level observation, and residual assumptions for transparent comparison. MAAP is intended for diagnostic reporting and comparative appraisal; validation as a predictive metric or certification scheme remains future work."
