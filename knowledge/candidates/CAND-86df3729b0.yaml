abstract: "Abstract As AI systems evolve from static tools to dynamic agents, traditional categorical governance frameworks—based on fixed risk tiers, levels of autonomy, or human oversight models—are increasingly insufficient on their own. Systems built on foundation models, self-supervised learning, and multi-agent architectures increasingly blur the boundaries that categories were designed to police. In this article, we make the case for dimensional governance: a framework that tracks how decision authority , process autonomy , and accountability (the 3As) distribute dynamically across human-AI relationships. A critical advantage of this approach is its ability to explicitly monitor system movement toward and across key governance thresholds, enabling pre-emptive adjustments before risks materialise. This dimensional approach provides the necessary foundation for more adaptive categorisation, enabling thresholds and classifications that can evolve with emerging capabilities. While categories remain essential for decision-making, building them upon dimensional foundations allows for context-specific adaptability and stakeholder-responsive governance that static approaches cannot achieve. We outline key dimensions, critical trust thresholds, and practical examples illustrating where rigid categorical frameworks fail—and where a dimensional mindset could offer a more resilient and future-proof path forward for both governance and innovation at the frontier of artificial intelligence."
