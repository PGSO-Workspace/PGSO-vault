abstract: Abstract The rapid development of General Artificial Intelligence Technology has attracted significant attention from global society, which gradually emerged some concerns due to the ethical implications it may bring. Experts, scholars, and the public from different fields and age groups have mixed views on this technology. Under the current circumstances, it is crucial to explore the relationship between digital intergenerational differences, cultural values, and the perception of ethical risks associated with artificial intelligence. Through multiple regression analysis by using Statistical Package for the Social Sciences (SPSS) on 310 collected responses, the results have indicated that digital intergenerational differences do not significantly affect the perception of ethical risks related to artificial intelligence; under the interaction of collectivism, long-term orientation, and intergenerational differences with masculinity, the impact on the perception of AI ethical risks is positive. Combining the findings can not only help to mitigate the inherent biases between digital generations but also facilitates a multidimensional approach to address differences in perceptions of AI ethical risks. Additionally, it contributes to establishing a more diverse and inclusive environment by incorporating cultural differences into policy formulation, enabling a collective response to potential ethical risks that may emerge in the future of the artificial intelligence field.
