abstract: Design science research (DSR) aims to generate knowledge about innovative solutions to real-world problems. Consequently, DSR needs to deal with the complexity related to problem and solution spaces involving sociotechnical phenomena that people perceive differently and are subject to constant change. This complexity poses challenges to sequential, process-based approaches—specifically, the existing DSR methodology. We designed a DSR methodology that extends existing approaches by adding a complementary organizing logic to address complexity. Based on the theory of hierarchical, multilevel systems, we suggest organizing DSR based on the concept of “echelons”—meaning decomposing DSR projects into smaller logically coherent self-contained parts—and suggest a set of five design echelons that imply a hierarchical organizing logic for DSR projects. The echeloned DSR (eDSR) methodology was developed in five iterations, involving seven design and evaluation episodes.
