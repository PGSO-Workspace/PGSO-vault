abstract: "Sentiment analysis is an important new field of research that has attracted the attention not only of researchers, but also businesses and organizations. In this article, the authors propose an effective model for aspect-based sentiment analysis for Vietnamese. First, sentiment dictionaries and syntactic dependency rules were combined to extract reliable word pairs (sentiment - aspect). They then relied on ontology to group these aspects and determine the sentiment polarity of each. They introduce two novel approaches in this work: 1) in order to “smooth” the sentiment scaling (rather than using discrete categories of 1, 0, and -1) for fined-grained classification, then extract multi-word sentiment phrases instead of sentiment words, and 2) the focus is not only on adjectives but also nouns and verbs. Initial evaluations of the system using real reviews show promising results."
