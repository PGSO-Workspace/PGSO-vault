abstract: "Graph theory studies mathematical structures composed of vertices and edges in order to model relationships and connectivity [1, 2]. A MetaGraph is a higher-level construct in which the vertices are themselves graphs, and the edges represent specified relations among those graphs. An Iterated MetaGraph extends this concept recursively: its vertices are MetaGraphs, producing a hierarchy of graph-of-graphs structures across multiple levels. In this work, we explore the possibility of extending Mixed Graphs, DiHyperGraphs, Knowledge Graphs, Intersection Graphs, and Chemical Graphs within the framework of MetaGraphs and Iterated MetaGraphs."
