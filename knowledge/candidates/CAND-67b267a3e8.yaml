abstract: "Abstract: The identification of distinct emotion regulation (ER) profiles has gained increasing attention, highlighting the diverse ways individuals regulate emotions. This systematic review synthesizes available evidence on ER profiles and identifies profiles correlates. From 38 studies included, several distinct ER profiles were identified, with three profiles being the most common ( n = 17 studies): the adaptive/selective, the moderate/high, and the dysregulated. The adaptive/selective emerged as the most beneficial due to its reliance on cognitive reappraisal and other adaptive strategies. These findings contribute to developing targeted interventions aimed at enhancing ER and promoting mental health according to individuals’ patterns of ER usage. Future research should focus on longitudinal studies to validate the stability of ER profiles, and to include a larger repertoire of ER strategies."
