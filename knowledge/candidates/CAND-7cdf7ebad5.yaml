abstract: The increasing integration of Artificial Intelligence (AI) in education (AIEd) and its dependence on contemporary communication infrastructures (5G/6G, the Internet of Things (IoT), and Multi-Access Edge Computing (MEC)) has prompted a surge of research into applications, infrastructural dependencies, and deployment constraints. This is giving rise to a new paradigm termed AI-Enabled Telecommunication-Based Education (AITE). This review synthesises the recent literature (2022–2025) to examine how telecommunications and AI technologies converge to enhance educational ecosystems through adaptive learning systems, intelligent tutoring systems, AI-driven assessment, and administration. The findings reveal that low-latency, high-bandwidth connectivity, combined with edge-deployed analytics, enables real-time personalisation, continuous feedback, and scalable learning models that extend beyond traditional classrooms. In addition, persistent critical challenges are also reported, including issues with ethical governance, data privacy, algorithmic fairness, and uneven access to digital infrastructure, all affecting equitable adoption. By linking pedagogical transformation with telecom performance metrics—namely, latency, Quality of Service (QoS), and device interconnectivity—this work outlines a unified cross-layer framework for AITE. This review concludes by identifying future research avenues in ethical AI deployment, resilient architectures, and inclusive policy design to ensure transparent, secure, and human-centred educational transformation.
