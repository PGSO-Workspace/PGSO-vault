abstract: "Ex-ante cost-benefit analyses and other impact assessments are now a standard part of the rulemaking process. Yet some important effects of regulation are difficultâor impossibleâto assess before a rule takes effect. In such cases, ex-post (or retrospective) evaluation, conducted after a rule is in effect, offers an opportunity to measure real-world outcomes that could not reliably be predicted in advance. Such an evaluation can help determine whether a rule achieves its intended goals, whether the imposed costs are justified, and whether any unintended consequences have emerged. However, when rules are not designed with ex-post evaluation in mind, measuring certain impacts may be difficult or impossible in practice. This article discusses options to revise the rulemaking process to avoid this problem. Designing rules with ex-post evaluation in mind would facilitate such evaluations, ultimately leading to better rules."
