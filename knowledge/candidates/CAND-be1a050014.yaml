abstract: "Large-language-model agents increasingly operate as persistent systems that plan, call tools, write and execute code, maintain memory, and coordinate with other agents. A newer class of systems goes further by changing its own prompts, memories, policies, workflows, skills, or model parameters during deployment. These self-evolving agents promise improved adaptability, but they also weaken the assumption that a system evaluated before deployment will remain behaviorally stable afterward. This review organizes the emerging literature around a central governance problem: how can an agent be allowed to learn and change without allowing its authority, objectives, or safety envelope to drift uncontrollably? We synthesize work on agent architectures, reflection, memory, tool learning, continual adaptation, constitutional constraints, human oversight, sandboxing, runtime monitoring, formal methods, and evaluation. We introduce a lifecycle taxonomy that separates the \\emph{object of change} (memory, prompt, policy, tools, code, parameters, or social organization), the \\emph{mechanism of change} (reflection, search, reinforcement learning, evolutionary optimization, or external feedback), and the \\emph{governance control} (authorization, monitoring, verification, rollback, audit, and recertification). The review argues that safe autonomy requires a separation between an agent's capacity to learn and its permission to act. It further identifies open problems in compositional verification, provenance-aware memory, long-horizon evaluation, multi-agent accountability, and governance of open-ended self-improvement. This manuscript is supplied as a research draft and should be revised with the author's own database search, screening log, and critical interpretation before submission."
