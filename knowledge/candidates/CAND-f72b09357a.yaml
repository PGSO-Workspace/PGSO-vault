url: https://doi.org/10.1093/iwc/iwaf042
abstract: Abstract With the advancement of technology, individuals are increasingly interacting with conversational agents in daily life. The current research examines the impact of anthropomorphism and empathy type on interactions with conversational agents. An experiment was conducted by manipulating an agent’s anthropomorphism level (low vs. high) and expressed empathy type (cognitive vs. affective). The results demonstrated that participants disclosed a larger amount of—and more intimate—information when interacting with the more (vs. less) anthropomorphized conversational agent. Moreover, anthropomorphism and empathy type jointly influenced the agent’s likability and uncanniness. Specifically, when the anthropomorphism level was high, exhibiting cognitive and affective empathy resulted in similar evaluations. However, when the anthropomorphism level was low, affective empathy reduced the perceived likability—and increased the uncanniness—of the conversational agent. The current research contributes to the conversational agent literature by examining the dynamics among anthropomorphism, self-disclosure, and empathy. It also offers practical implications for optimizing the design of conversational agents to support positive user–agent interactions.
