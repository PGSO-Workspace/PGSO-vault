url: https://doi.org/10.64898/2026.09.07.749780
abstract: When people engage in spontaneous thought under low external constraint, thought content changes continuously and can shift across topics. However, the cognitive computational principles governing these transitions remain unclear, as does whether similar dynamics emerge in artificial language generation. Here, we formalized spontaneous narrative dynamics using a foraging-inspired framework, constructing an agent based on the marginal value theorem (MVT) that balances exploration and exploitation while selecting among informational resources represented in a participant-specific, high-order patch network. Patches were defined as partially overlapping composite structures containing second-order paths and third-order interactions, with their available resources quantified using multilevel structure values. In a multi-theme free spoken narrative task, the model predicted the temporal organization of human patch activation substantially better than random-shuffle baselines, although the strength of model conformity varied across participant–theme samples. Model-predicted patch transitions corresponded to systematic semantic segmentation and reorganization across multiple representational levels. Transition rates were positively associated with the perceived importance and likelihood of the narrated events. These findings were replicated when the modeled memory environment was enriched with additional hub-related narrative resources in a supplemental experiment. Control-model analyses further showed that patch-network topology, resource depletion history, or either order of structure value alone could explain only part of the observed dynamics; the most stable human prediction required foraging-related decisions guided jointly by multilevel structure values. Narratives generated by large language models (LLMs) also showed detectable conformity with the same framework, but the full model captured LLM content less consistently, while simpler control models accounted for a larger proportion of their patch-level dynamics. Together, these findings support a computational account in which patch-level narrative dynamics are organized by value-guided foraging over structured memory resources, while revealing graded differences in the strength and stability of these dynamics across human and artificial language generation.
