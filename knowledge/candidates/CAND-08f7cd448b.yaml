abstract: Large language models (LLMs) are increasingly deployed in mobile, edge, and cloud-integrated systems to support complex tasks such as system orchestration. In these contexts, LLMs rely on external tools to access real-time data, control resources, and perform specialized numerical analyses, enabling them to make dynamic and informed decisions. To enable seamless integration of external tools with LLMs, the Model Context Protocol (MCP) is introduced to standardize interactions, enhancing interoperability and adaptability. However, it also introduces new security risks, including tool poisoning attacks and malicious impersonation of the MCP Server. In this paper, we propose a framework for trustworthy tool invocation in LLMs based on a dual signature verification mechanism, designed to protect against MCP Server tampering and tool-based prompt injection attacks. A tool can be invoked only after verifying signatures from both a trusted third-party platform and the developer. Our implementation introduces minimal overhead while maintaining full compatibility with existing MCP servers.
