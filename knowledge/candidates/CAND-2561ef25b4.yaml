abstract: Sentiment analysis is a text mining discipline that aims to identify and extract subjective information. This growing field results in the emergence of three levels of granularity (document, sentence, and aspect). However, both the document and sentence levels do not find what exactly the opinion holder likes and dislikes. Furthermore, most research in this field deals with English texts, and very limited researches are undertaken on Arabic language. In this paper, the authors propose a semantic aspect-based sentiment analysis approach for Arabic reviews. This approach utilizes the semantic of description logics and linguistic rules in the identification of opinion targets and their polarity.
