abstract: "Abstract This study addresses the intersection of ethics and software test automation, driven by the use of Artificial Intelligence (AI) in software testing. Complex ethical challenges arise while applying AI and automation in the different stages of software testing such as case creation and selection, test execution, resource allocation, and interpretation of test results thereafter utilised in the industry. Despite the availability of ethical guidelines, the practical implementation of ethical AI in test automation needs to be clarified. To this end, we identified nine key ethical themes: human control and responsibility, justice and fairness, explainability (including logging and monitoring), human-centric risk analysis, stakeholder involvement, impact on human relations, technical risk analysis, sustainability and waste, and privacy. These themes were examined through a questionnaire, iteratively refined and evaluated through a pilot study with four experts, followed by a survey involving 54 participants from diverse backgrounds in software test automation. The findings reveal an agreement among participants on the importance of issues like explainability, privacy, and technical risks while highlighting the lack of consideration of human-centric risks. This paper brings some insights into AI ethics in software testing, specifically proposing the adoption of the questionnaire as guidance for professionals and researchers dealing with the ethical challenges of AI-powered test automation."
