title: Vector Space Transformations to Uncover Knowledge Graphs in Neural Language Models
authors:
  - Giacomo Munda
  - Dagmar Gromann
  - Tobias Heinzle
year: 2025
venue: Frontiers in Artificial Intelligence and Applications
