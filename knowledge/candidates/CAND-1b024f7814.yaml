doi: 10.1080/00207543.2025.2604311
url: https://doi.org/10.1080/00207543.2025.2604311
abstract: Supply Chain Management relies on human consensus in decision-making to avoid emergent problems like the bullwhip effect. Some routine consensus processes, especially those that are time-intensive, can be automated. Previously proposed supply chain automation solutions for consensus-seeking and coordination faced computational challenges, resulting in high entry barriers. Recent advances in Generative AI, particularly Large Language Model agents (LLM agents), could overcome these barriers. This paper explores how LLM agents can automate consensus-seeking in supply chains. We introduce a series of novel, supply chain-specific consensus-seeking frameworks and validate the effectiveness of our approach through a case study in inventory management, where agents that represent companies in a supply chain are able to balance selfish goals with systemic outcomes through conversation. Our results show that introducing LLM-based consensus-seeking frameworks reduces bullwhip effects. When equipped with appropriate tools, LLM agents can minimise bullwhip better than restocking policies and centralised demand approaches. Additionally, when LLM agents are handled within a negotiation framework, their behaviour converges to best practices in the supply chain literature on how to lessen the bullwhip effect. To provide a foundation for further advancements in LLM-based autonomous supply chain solutions, we open-source our code.
