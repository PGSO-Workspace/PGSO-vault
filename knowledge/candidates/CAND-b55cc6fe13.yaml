abstract: "Abstract Automated static analysis tools are commonly integrated into continuous integration pipelines; however, their longitudinal effects on open source workflow dynamics remain incompletely characterized. In GitHub pull-request--based development, these tools are typically embedded as automated checks that interact with code review, integration, and maintenance processes, while their effects may also appear in issue tracking through coordination and resolution activities. This study analyzes 82 GitHub-based open source projects that adopted SonarCloud and examines how automated static analysis adoption is associated with changes in issue-resolution efficiency, pull-request processing efficiency, and maintainer activity over time. Issues and pull requests are treated as complementary workflow artifacts: pull requests represent the immediate integration pathway affected by automated checks, whereas issues reflect maintenance and coordination work that may evolve after adoption. To characterize adoption-aligned workflow changes while accounting for temporal structure, we employ interrupted time series analysis using consistent 30-day aggregation windows, complemented by linear regression models that control for project-level characteristics. The results indicate that SonarCloud adoption is associated with faster downward trends in issue closure time after adoption, suggesting improved issue-resolution efficiency over time. In contrast, pull-request closure and merge durations exhibit heterogeneous patterns, indicating that the effects of automated static analysis on integration workflows vary across projects and outcomes. Project-level characteristics, including size, age, popularity, and programming language, are associated with differences in workflow dynamics and provide important context for interpreting adoption effects. Overall, the findings show that automated static analysis adoption is linked to measurable longitudinal changes in GitHub open source workflow dynamics, with effects shaped by project context."
