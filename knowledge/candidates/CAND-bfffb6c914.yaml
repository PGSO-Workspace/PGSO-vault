abstract: 'This study aims to discuss the motives, causes and factors of crime, to understand and explain it, within the framework of criminal psychology and some sciences related to it. Crime and violent behavior are two sides of the same coin: "criminality". In this context, criminal psychology is positioned between the legal context and the psychological approach. Even if we consider, at first glance, that political dimensions have a role in modifying criminal behavior, this implies, in return, reformulating texts and laws, or even decrees, so that they respond to the psychological, social and emotional specificities of the convicted person. On this basis, we will discuss the relationship between violent behavior and crime, within the framework of the relationship between psychological explanations and the legal controls of these. The purpose of this discussion is to recognize the intrinsic (pathological) motivations and delusions that contribute to filling the mind with criminal thoughts contrary to social controls. Consequently, the opportunities for community integration decrease. The accused, or the prisoner of a penitentiary institution, can benefit from mitigating conditions, if he adopts a strategy of prevention and awareness whose foundations derive from psychological treatment. On this basis, we begin our analysis by answering the following questions: Do we give priority to psychological characteristics during and after violent behavior? Or do we rely on the legal requirements adopted by the authority? Is society satisfied with the punitive and rehabilitative role of penitentiary institutions, to reduce violent behavior? Or does this require a preventive approach and that the convicted or prisoner undergo psychological treatment ?'
