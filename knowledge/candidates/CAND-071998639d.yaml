abstract: As environmental pollution intensifies and ecological challenges become more pronounced, fostering pro-environmental behavior (PEB) is increasingly important for sustainable urban development. Although prior studies have linked environmental perception to environmental behavior, the emotional mechanisms underlying this relationship remain insufficiently explored, especially the joint roles of multiple pathways. This study examines how landscape perception is associated with pro-environmental behavior through empathy and place attachment. A questionnaire survey was conducted with 478 users across three comprehensive urban parks in Chengdu, China. Structural equation modeling was applied to estimate direct and indirect relationships among landscape perception, emotional responses, and PEB. Results indicate that positive landscape perceptions significantly promote PEB both directly and indirectly. Empathy and place attachment serve as key mediators, with empathy exerting a stronger mediating effect. Clarifying these differentiated emotional pathways advances understanding of environment and behavior relationships and informs the design and management of urban green spaces to support broader urban environmental governance.
