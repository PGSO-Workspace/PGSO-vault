abstract: This study identified how children’s participation rights are upheld in an early childhood education setting, drawing on extracts taken from 75 hours of video recordings of educator-child and child-child interactions. The study developed a new instrument, Listening to Voices in Interaction for Participation (LViIP) that employed conversation analysis and Lundy’s model of participation (2007). The tool identified the precisely timed verbal and non-verbal actions facilitating rights enactment, demonstrated how children create spaces for their voices to exert influence, and how even young children can be peer coaches. The study’s implications include fresh perspectives on how participation rights can be achieved.
