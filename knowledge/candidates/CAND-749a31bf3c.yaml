title: Model Context Protocol (MCP) or Agent-to-Agent (A2A) — Defining Right Communication Protocol for Agentic AI in Financial Services Use Cases
authors:
  - Aditya Ghosh
  - Siddhartha Kumar Ghosh
year: 2026
venue: International Journal of Innovative Research in Engineering & Management
