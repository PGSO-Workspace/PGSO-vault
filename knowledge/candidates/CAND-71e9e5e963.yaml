abstract: This workshop introduces Agentic Data Analytics, the next frontier in research automation. Unlike standard chatbots, autonomous AI agents can plan, execute, debug, and summarize an entire scientific analysis — and even draft the report. Using the free Google Antigravity tool, participants learn how to build reproducible agentic workflows using precise natural language, covering data cleaning, analysis, visualization, and report generation directly on their laptop.
