abstract: "Are individual differences in political ideology associated with inclinations to hold more or less ambivalent attitudes? Extant research on the linear association of political ideology with attitudinal ambivalence yielded inconsistent findings. The present research tested the hypotheses (a) that the association of political ideology with attitudinal ambivalence is curvilinear with lower levels of ambivalence at both extremes of the ideological spectrum and (b) that higher political interest is associated with lower levels of attitudinal ambivalence. It used data from large and demographically diverse electoral surveys in a set of three studies (Study 1: N = 13,808; Study 2: N = 6,528; Study 3: N = 4,789) that focused on attitudes toward political candidates (Studies 1 and 2) as well as political parties (Study 3) in Germany. Overall, the results support both hypotheses even when general attitudes toward the politicians and parties are controlled in the analyses."
