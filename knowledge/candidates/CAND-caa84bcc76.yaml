abstract: У роботі досліджено проблему інтеграції автономних агентів на основі великих мовних моделей із корпоративними інформаційними системами. Показано, що класичний підхід зі створенням окремих адаптерів між кожним агентом і кожним джерелом даних чи інструментом призводить до комбінаторного зростання кількості з’єднань і не масштабується для промислових сценаріїв. Запропоновано метод інтеграції, який використовує відкритий протокол Model Context Protocol як універсальний шар діалогу між AI-агентами та корпоративними ІТ-системами. Сформульовано основні етапи методу та визначено функціональні модулі програмного середовища для його реалізації, що включає реєстр MCP-серверів, шлюз авторизації та сервіс аудиту викликів інструментів.
