excerpt: |-
  The first is prompt sovereignty, according to which the textual instruction
  layer retains its authority, since the mechanism governs the tool catalog and can only add an additive,
  removable directive, without rewriting the agent's behavior. The second is the inviolability of the
  allowlist, according to which no protected tool can be withdrawn from the catalog, and enforcement
  is deterministic and does not depend on the reliability of the perceptual module. The third is non
  punitiveness, according to which scope reductions are reversible and proportional to the perceived
  state. The fourth is abstention under low confidence, according to which in the face of an unreliable
  prosodic reading the system expresses its uncertainty and abstains rather than committing a
  classification. The fifth is auditability, according to which every scope decision is recorded with its rule,
  axis, and associated deviation.
