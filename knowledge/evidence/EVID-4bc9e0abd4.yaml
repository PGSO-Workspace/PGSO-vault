excerpt: |-
  The purpose of this research is to design and validate a mechanism that governs, in a deterministic
  and auditable manner, the behavior of a tool augmented conversational agent from the interlocutor's
  paralinguistic signal estimated without transcription. From this purpose three objectives are derived,
  namely to formulate paralinguistic governance as a control mechanism that translates prosody into
  decisions over the tool catalog, to guarantee that the uncertainty of perception does not propagate
  to authorization through an explicit separation between perception and action, and to honestly
  characterize the scope of the mechanism and of the signal on acted speech.
