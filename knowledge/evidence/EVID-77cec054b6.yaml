excerpt: |-
  The evaluation is designed with the FEDS framework, short for Framework for Evaluation in Design
  Science, which characterizes each evaluation episode according to two dimensions, the functional
  purpose, which can be formative or summative, and the paradigm, which can be artificial or
  naturalistic. Consistent with the initial state of the artifact, the evaluation of this work is formative
  and artificial, since it seeks to provide evidence of feasibility and correctness of the mechanism, and
  not to establish its definitive performance in deployment conditions. The evaluated properties derive
  directly from the objectives, namely the correctness of deterministic enforcement, abstention
  behavior, the completeness of the audit trail, and the discriminative capacity of the perceptual signal.
  Summative and naturalistic evaluation, on spontaneous speech and in real interaction, is recognized
  as future work.
