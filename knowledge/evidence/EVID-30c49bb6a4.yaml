excerpt: "Research paraphrase, not a quotation: Synthesizes linear fallback controllers through counterexample-guided refinement and chooses a command-deviation switching threshold by Bayesian optimization. Eight control systems are compared with VRL; effectiveness uses 1,000 episodes of 5,000 steps; experiments repeat ten times. §5.4 requires convex safety regions; §5.5 assumes sufficiently linearizable dynamics. Audio-input systems are future work. Zero observed violations do not prove safety for arbitrary uncertain speech observations. Controller verification and optimized switching must not be conflated."
