excerpt: |-
  As to internal validity, the governance curve is obtained by degrading
  the signal with synthetic noise, which isolates the quality axis but does not reproduce the structured
  error of a real extractor, and the demonstration scenarios employ deterministic readings to guarantee
  reproducibility, so that the tolerance of the mechanism to a synthetic correlation of 0.2 does not
  establish its tolerance to the real signal in deployment. As to external validity, the evaluation is carried
  out over a single corpus of acted speech, the triggering of the directive from real audio corresponds
  to a single speaker in a controlled session, and only the activation axis is instrumented, so that
  generalization to spontaneous speech, to diverse speakers, to other languages, and to additional axes
  falls outside what is established.
