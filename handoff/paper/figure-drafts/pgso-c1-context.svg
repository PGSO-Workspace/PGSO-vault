<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 2291 578" width="2291" height="578" font-family="Helvetica, Arial, sans-serif">
<rect x="-24" y="-24" width="2291" height="578" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a1a1a"/></marker></defs>
<rect x="2" y="0" width="342" height="180" rx="3" fill="#F2F2F2" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="173.0" y="53.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Interlocutor</text>
<text x="173.0" y="79.0" font-size="15" text-anchor="middle" fill="#444">Conversa con el agente. Su audio</text>
<text x="173.0" y="101.0" font-size="15" text-anchor="middle" fill="#444">alimenta la percepción; conserva el</text>
<text x="173.0" y="123.0" font-size="15" text-anchor="middle" fill="#444">control de las aprobaciones</text>
<text x="173.0" y="145.0" font-size="15" text-anchor="middle" fill="#444">explícitas.</text>
<rect x="0" y="290" width="346" height="180" rx="3" fill="#F2F2F2" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="173.0" y="354.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Integrador del agente</text>
<text x="173.0" y="380.0" font-size="15" text-anchor="middle" fill="#444">Configura reglas, catálogo, permisos y</text>
<text x="173.0" y="402.0" font-size="15" text-anchor="middle" fill="#444">caducidad. Decide qué operaciones</text>
<text x="173.0" y="424.0" font-size="15" text-anchor="middle" fill="#444">necesitan aprobación.</text>
<rect x="643" y="30" width="331" height="180" rx="3" fill="#F2F2F2" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="808.5" y="94.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Agente de IA de voz</text>
<text x="808.5" y="120.0" font-size="15" text-anchor="middle" fill="#444">Consumidor de PGSO. Recibe el catálogo</text>
<text x="808.5" y="142.0" font-size="15" text-anchor="middle" fill="#444">vigente y propone llamadas a</text>
<text x="808.5" y="164.0" font-size="15" text-anchor="middle" fill="#444">herramientas.</text>
<rect x="1280" y="205" width="357" height="180" rx="3" fill="white" stroke="#1a1a1a" stroke-width="1.4" />
<text x="1458.5" y="258.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Integración PGSO</text>
<text x="1458.5" y="284.0" font-size="15" text-anchor="middle" fill="#444">Gobierna el acceso a herramientas con</text>
<text x="1458.5" y="306.0" font-size="15" text-anchor="middle" fill="#444">señales acústicas. Separa percepción</text>
<text x="1458.5" y="328.0" font-size="15" text-anchor="middle" fill="#444">incierta, política determinista y</text>
<text x="1458.5" y="350.0" font-size="15" text-anchor="middle" fill="#444">autorización.</text>
<rect x="1903" y="60" width="339" height="180" rx="3" fill="#F2F2F2" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="2072.5" y="124.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Herramientas de negocio</text>
<text x="2072.5" y="150.0" font-size="15" text-anchor="middle" fill="#444">Ejecutan efectos externos. Solo se</text>
<text x="2072.5" y="172.0" font-size="15" text-anchor="middle" fill="#444">invocan a través del callback</text>
<text x="2072.5" y="194.0" font-size="15" text-anchor="middle" fill="#444">autorizado por el runtime.</text>
<rect x="1913" y="350" width="320" height="180" rx="3" fill="#F2F2F2" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="2073.0" y="414.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Registro del host</text>
<text x="2073.0" y="440.0" font-size="15" text-anchor="middle" fill="#444">Persiste transiciones y recibos. PGSO</text>
<text x="2073.0" y="462.0" font-size="15" text-anchor="middle" fill="#444">no incluye una base de datos ni</text>
<text x="2073.0" y="484.0" font-size="15" text-anchor="middle" fill="#444">garantiza la persistencia por sí solo.</text>
<path d="M 345,98 L 434,102 L 543,107 L 633,112" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="408" y="94" font-size="15" fill="#222">Conversación y aprobación</text>
<path d="M 347,369 L 587,353 L 1022,324 L 1270,307" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="728" y="320" font-size="15" fill="#222">Configuración y permisos</text>
<path d="M 975,165 L 1065,189 L 1177,219 L 1270,244" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1036" y="174" font-size="15" fill="#222">Audio y llamadas propuestas</text>
<path d="M 1638,253 L 1718,234 L 1813,211 L 1893,192" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1704" y="197" font-size="15" fill="#222">Ejecución autorizada</text>
<path d="M 1638,337 L 1722,357 L 1821,380 L 1903,400" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1699" y="347" font-size="15" fill="#222">Transiciones y recibos</text>
</svg>