<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
<title id="title">Recorded PGSO lifecycle traces for two contract episodes</title>
<desc id="desc">Two recorded episodes at prior 0.5, deviation threshold 0.3, confidence threshold 0.5 and persistence 3. In both, three consecutive accepted readings at 0.95 put the quote tool out of the served catalog while human stays served throughout. In A a reading of 0.5 at confidence 0.9 is accepted and quote returns. In B a reading of the same value at confidence 0.49 abstains, and quote stays blocked. The values, confidences and allow or block actions are recorded; the run counter shown under each reading is derived by applying the documented persistence rule, and it agrees with the recorded transitions. These are governance transitions on authored episodes, not emotion accuracy.</desc>
<rect width="1040" height="700" fill="white"/>
<g font-family="Arial,sans-serif" fill="#222">
<text x="40" y="36" font-size="22">Recorded lifecycle: what retires a restriction is an accepted reading</text>
<text x="40" y="60" font-size="13">Prior 0.5, deviation threshold 0.3, confidence threshold 0.5, persistence 3. Authored episodes; no human labels.</text>
<text x="40" y="96" font-size="16">A. An accepted reading below the band retires the restriction</text>
<rect x="90" y="132.0" width="780" height="72.0" fill="#f0f4f8"/>
<text x="876" y="172.0" font-size="11" fill="#667">within 0.3</text>
<line x1="90" y1="168.0" x2="870" y2="168.0" stroke="#889" stroke-width="1" stroke-dasharray="5 4"/>
<text x="80" y="172.0" font-size="11" text-anchor="end" fill="#667">prior 0.5</text>
<text x="80" y="232.0" font-size="11" text-anchor="end" fill="#999">0.0</text>
<text x="80" y="172.0" font-size="11" text-anchor="end" fill="#999">0.5</text>
<text x="80" y="112.0" font-size="11" text-anchor="end" fill="#999">1.0</text>
<text x="120.0" y="250" font-size="11" text-anchor="middle" fill="#333">run 1</text>
<text x="120.0" y="266" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="300.0" y="250" font-size="11" text-anchor="middle" fill="#333">run 2</text>
<text x="300.0" y="266" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="480.0" y="250" font-size="11" text-anchor="middle" fill="#333">run 3</text>
<text x="480.0" y="266" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="660.0" y="250" font-size="11" text-anchor="middle" fill="#333">run 4</text>
<text x="660.0" y="266" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="840.0" y="250" font-size="11" text-anchor="middle" fill="#333">nominal</text>
<text x="840.0" y="266" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<path d="M120.0,114.0 L300.0,114.0 L480.0,114.0 L660.0,114.0 L840.0,168.0" fill="none" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="120.0" cy="114.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="300.0" cy="114.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="480.0" cy="114.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="660.0" cy="114.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="840.0" cy="168.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<text x="80" y="300" font-size="12" text-anchor="end">quote</text>
<line x1="90" y1="296" x2="870" y2="296" stroke="#e6e6e6" stroke-width="1"/>
<circle cx="120.0" cy="296" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<circle cx="300.0" cy="296" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="473.0" y="289" width="14" height="14" fill="#333"/>
<rect x="653.0" y="289" width="14" height="14" fill="#333"/>
<circle cx="840.0" cy="296" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<text x="80" y="334" font-size="12" text-anchor="end">human</text>
<line x1="90" y1="330" x2="870" y2="330" stroke="#e6e6e6" stroke-width="1"/>
<circle cx="120.0" cy="330" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<circle cx="300.0" cy="330" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<circle cx="480.0" cy="330" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<circle cx="660.0" cy="330" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<circle cx="840.0" cy="330" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<text x="120.0" y="354" font-size="11" text-anchor="middle" fill="#666">400 ms</text>
<text x="300.0" y="354" font-size="11" text-anchor="middle" fill="#666">800 ms</text>
<text x="480.0" y="354" font-size="11" text-anchor="middle" fill="#666">1200 ms</text>
<text x="660.0" y="354" font-size="11" text-anchor="middle" fill="#666">1600 ms</text>
<text x="840.0" y="354" font-size="11" text-anchor="middle" fill="#666">2000 ms</text>
<text x="40" y="374" font-size="16">B. The same value, not accepted, does not retire it</text>
<rect x="90" y="410.0" width="780" height="72.0" fill="#f0f4f8"/>
<text x="876" y="450.0" font-size="11" fill="#667">within 0.3</text>
<line x1="90" y1="446.0" x2="870" y2="446.0" stroke="#889" stroke-width="1" stroke-dasharray="5 4"/>
<text x="80" y="450.0" font-size="11" text-anchor="end" fill="#667">prior 0.5</text>
<text x="80" y="510.0" font-size="11" text-anchor="end" fill="#999">0.0</text>
<text x="80" y="450.0" font-size="11" text-anchor="end" fill="#999">0.5</text>
<text x="80" y="390.0" font-size="11" text-anchor="end" fill="#999">1.0</text>
<text x="120.0" y="528" font-size="11" text-anchor="middle" fill="#333">run 1</text>
<text x="120.0" y="544" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="360.0" y="528" font-size="11" text-anchor="middle" fill="#333">run 2</text>
<text x="360.0" y="544" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="600.0" y="528" font-size="11" text-anchor="middle" fill="#333">run 3</text>
<text x="600.0" y="544" font-size="10" text-anchor="middle" fill="#999">q=0.9</text>
<text x="840.0" y="528" font-size="11" text-anchor="middle" fill="#888">abstains</text>
<text x="840.0" y="544" font-size="10" text-anchor="middle" fill="#999">q=0.49</text>
<path d="M120.0,392.0 L360.0,392.0 L600.0,392.0 L840.0,446.0" fill="none" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="120.0" cy="392.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="360.0" cy="392.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="600.0" cy="392.0" r="5.5" fill="#0072b2" stroke="#0072b2" stroke-width="1.6"/>
<circle cx="840.0" cy="446.0" r="5.5" fill="white" stroke="#999" stroke-width="1.6"/>
<text x="80" y="578" font-size="12" text-anchor="end">quote</text>
<line x1="90" y1="574" x2="870" y2="574" stroke="#e6e6e6" stroke-width="1"/>
<rect x="593.0" y="567" width="14" height="14" fill="#333"/>
<rect x="833.0" y="567" width="14" height="14" fill="#333"/>
<text x="80" y="612" font-size="12" text-anchor="end">human</text>
<line x1="90" y1="608" x2="870" y2="608" stroke="#e6e6e6" stroke-width="1"/>
<circle cx="600.0" cy="608" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<circle cx="840.0" cy="608" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
<text x="120.0" y="632" font-size="11" text-anchor="middle" fill="#666">400 ms</text>
<text x="360.0" y="632" font-size="11" text-anchor="middle" fill="#666">800 ms</text>
<text x="600.0" y="632" font-size="11" text-anchor="middle" fill="#666">1200 ms</text>
<text x="840.0" y="632" font-size="11" text-anchor="middle" fill="#666">1600 ms</text>
<g transform="translate(40,666)" font-size="12">
<circle cx="6" cy="-4" r="6" fill="white" stroke="#333" stroke-width="1.5"/><text x="20" y="0">served</text>
<rect x="96" y="-11" width="14" height="14" fill="#333"/><text x="118" y="0">out of the served catalog</text>
<circle cx="290" cy="-4" r="5.5" fill="#0072b2"/><text x="303" y="0">accepted reading</text>
<circle cx="440" cy="-4" r="5.5" fill="white" stroke="#999" stroke-width="1.6"/><text x="453" y="0">abstained: state and restriction both held</text>
</g>
</g></svg>
