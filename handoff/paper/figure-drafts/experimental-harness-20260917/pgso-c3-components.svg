<text x="839" y="888" font-size="15" fill="#222">implements Actuator</text>
<path d="M 1252,490 L 1260,510 L 1266,530 L 1270,550 L 1290,654 L 1288,697 L 1182,813 L 1098,906 L 968,965 L 864,1000" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1281" y="727" font-size="15" fill="#222">implements Actuator</text>
<path d="M 1143,490 L 1111,532 L 1073,582 L 1040,625" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1097" y="565" font-size="15" fill="#222">reuses the tool surface</text>
<path d="M 223,180 L 223,198 L 223,218 L 223,239" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="125" y="230" font-size="15" fill="#222">observations, candidate calls</text>
<path d="M 693,1176 L 693,1199 L 693,1224 L 693,1247" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="539" y="1209" font-size="15" fill="#222">authorized callback only</text>
</svg>